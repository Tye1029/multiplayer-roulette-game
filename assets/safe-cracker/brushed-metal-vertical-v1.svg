<svg xmlns="http://www.w3.org/2000/svg" width="128" height="192" viewBox="0 0 128 192">
  <defs>
    <filter id="verticalBrush" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.68 0.009" numOctaves="3" seed="37" stitchTiles="stitch" result="coarse"/>
      <feGaussianBlur in="coarse" stdDeviation="0.18 7" result="coarseStreaks"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.94 0.025" numOctaves="2" seed="73" stitchTiles="stitch" result="fine"/>
      <feGaussianBlur in="fine" stdDeviation="0.08 2.2" result="fineStreaks"/>
      <feBlend in="coarseStreaks" in2="fineStreaks" mode="multiply" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0.62 0 0 0 0.16  0 0.66 0 0 0.18  0 0 0.7 0 0.2  0 0 0 1 0"/>
    </filter>
    <linearGradient id="softSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11181c" stop-opacity=".2"/>
      <stop offset=".28" stop-color="#f5f8f9" stop-opacity=".08"/>
      <stop offset=".44" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".58" stop-color="#d8e0e3" stop-opacity=".08"/>
      <stop offset="1" stop-color="#10171b" stop-opacity=".24"/>
    </linearGradient>
  </defs>
  <rect width="128" height="192" fill="#778388" filter="url(#verticalBrush)"/>
  <rect width="128" height="192" fill="url(#softSheen)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M17 8v84 M17 104v63" stroke="#f8fafb" stroke-opacity=".16" stroke-width=".55"/>
    <path d="M31 28v135" stroke="#151c20" stroke-opacity=".14" stroke-width=".7"/>
    <path d="M48 2v58 M48 69v106" stroke="#ffffff" stroke-opacity=".12" stroke-width=".45"/>
    <path d="M73 19v149" stroke="#10171a" stroke-opacity=".13" stroke-width=".65"/>
    <path d="M98 5v77 M98 94v89" stroke="#f7f9fa" stroke-opacity=".13" stroke-width=".5"/>
    <path d="M113 35v122" stroke="#151c20" stroke-opacity=".12" stroke-width=".55"/>
  </g>
</svg>
