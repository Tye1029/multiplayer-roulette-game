      <stop offset=".58" stop-color="#d8e0e3" stop-opacity=".08"/>
      <stop offset="1" stop-color="#10171b" stop-opacity=".24"/>
    </linearGradient>
  </defs>
  <rect width="192" height="128" fill="#778388" filter="url(#horizontalBrush)"/>
  <rect width="192" height="128" fill="url(#softSheen)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M8 17H92 M104 17h63" stroke="#f8fafb" stroke-opacity=".16" stroke-width=".55"/>
