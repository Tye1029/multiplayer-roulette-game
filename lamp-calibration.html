<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Roulette Lamp Calibration</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui}iframe{border:0;width:100%;height:100%;display:block}#toggle{position:fixed;right:10px;top:145px;z-index:10;padding:11px 14px;border:2px solid #f2a13b;border-radius:10px;background:#1a120c;color:#ffd695;font-weight:900}#panel{display:none;position:fixed;right:8px;top:192px;z-index:11;width:min(375px,calc(100vw - 16px));max-height:calc(100vh - 205px);overflow:auto;padding:14px;border:2px solid #b96c24;border-radius:14px;background:rgba(12,9,7,.97);color:#eee;box-shadow:0 12px 40px #000d}#panel.open{display:block}h3{margin:0 0 10px;color:#ffd38c}.row{display:grid;grid-template-columns:120px 1fr 54px;gap:8px;align-items:center;margin:8px 0}.row input{width:100%}.row output{color:#ffbd66;text-align:right;font-variant-numeric:tabular-nums}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}button{padding:8px 10px;border:1px solid #a86225;border-radius:8px;background:#332116;color:#ffe1aa;font-weight:800}small{display:block;margin-top:10px;color:#aaa}#status{position:fixed;left:8px;bottom:8px;z-index:12;background:#111e;color:#ffd695;border:1px solid #b96c24;border-radius:8px;padding:7px 10px;font:700 12px system-ui}
</style></head><body><iframe id="game" src="./?lampCalibration=2"></iframe><button id="toggle">LAMP CALIBRATION</button><div id="panel"><h3>Live lamp calibration</h3></div><div id="status">Waiting for roulette scene…</div>
<script>
const defaults={lampX:50,lampY:22,lampWidth:44,chainHeight:27,swing:3.2,speed:5.6,bulbGlowY:88,bulbGlowSize:15,lightX:50,lightY:-19,spreadX:143,spreadY:158,strength:.92,roomGlow:.35,wallBrightness:.72,gunGleam:.35,track:6};
const KEY='rrLampCalibrationV2';let cfg={...defaults},raf=0,start=performance.now();try{Object.assign(cfg,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}
const specs=[['Lamp X %','lampX',30,70,.25],['Lamp Y %','lampY',5,45,.25],['Lamp width %','lampWidth',20,70,.25],['Chain height %','chainHeight',5,45,.25],['Swing degrees','swing',0,9,.1],['Swing seconds','speed',2,12,.1],['Bulb glow Y %','bulbGlowY',70,105,.25],['Bulb glow size %','bulbGlowSize',3,30,.25],['Light X %','lightX',15,85,.25],['Light Y %','lightY',-50,35,.5],['Light width %','spreadX',60,230,1],['Light height %','spreadY',70,240,1],['Table strength','strength',0,1.5,.01],['Room glow','roomGlow',0,1,.01],['Wall brightness','wallBrightness',.25,1.25,.01],['Gun gleam','gunGleam',0,1,.01],['Track amount','track',0,18,.1]];
const panel=document.getElementById('panel');function row([label,id,min,max,step]){return `<label class="row"><span>${label}</span><input data-id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${cfg[id]}"><output data-out="${id}">${cfg[id]}</output></label>`}panel.insertAdjacentHTML('beforeend',specs.map(row).join('')+'<div class="actions"><button id="center">Center on gun</button><button id="save">Save</button><button id="copy">Copy JSON</button><button id="reset">Reset</button></div><small>These controls target the visible V148 rr126 lamp rig. Create/open a Russian Roulette game first.</small>');
document.getElementById('toggle').onclick=()=>panel.classList.toggle('open');
panel.querySelectorAll('input').forEach(i=>i.oninput=()=>{cfg[i.dataset.id]=+i.value;panel.querySelector(`[data-out="${i.dataset.id}"]`).value=i.value;apply()});
function doc(){try{return document.getElementById('game').contentDocument}catch{return null}}function root(){return doc()?.querySelector('[data-roulette-game]')}
function imp(el,p,v){if(el)el.style.setProperty(p,v,'important')}
function apply(){const d=doc(),r=root();if(!d||!r)return false;const chain=r.querySelector('.rr126-chain'),swing=r.querySelector('.rr126-swing'),glow=r.querySelector('.rr126-bulb-glow'),room=r.querySelector('.rr126-room-glow'),beam=r.querySelector('.rr126-beam'),table=r.querySelector('.rr-table'),pool=r.querySelector('.rr-v100-table-pool'),back=r.querySelector('.rr-backwall'),gun=r.querySelector('.rr-gun-motion');
 imp(chain,'left',cfg.lampX+'%');imp(chain,'height',cfg.chainHeight+'%');imp(swing,'left',cfg.lampX+'%');imp(swing,'top',cfg.lampY+'%');imp(swing,'width',cfg.lampWidth+'%');imp(swing,'animation','none');imp(glow,'top',cfg.bulbGlowY+'%');imp(glow,'width',cfg.bulbGlowSize+'%');imp(room,'opacity',cfg.roomGlow);imp(beam,'opacity',Math.min(1,cfg.roomGlow*.8));
 if(table){imp(table,'--v100-table-x',cfg.lightX+'%');imp(table,'--v105-table-x',cfg.lightX+'%')}if(pool){imp(pool,'left',cfg.lightX+'%');imp(pool,'top',cfg.lightY+'%');imp(pool,'width',cfg.spreadX+'%');imp(pool,'height',cfg.spreadY+'%');imp(pool,'opacity',cfg.strength)}if(back)imp(back,'filter',`brightness(${cfg.wallBrightness}) saturate(.96)`);if(gun){imp(gun,'--v101-specular-strength',cfg.gunGleam);imp(gun,'--v100-gun-light',1+cfg.gunGleam*.25);imp(gun,'--v100-gun-warm',cfg.gunGleam*.18)}
 document.getElementById('status').textContent='Connected to visible rr126 lamp';return true}
function tick(now){const r=root();if(r){const s=Math.sin(((now-start)/1000)/Math.max(.5,cfg.speed)*Math.PI*2),angle=s*cfg.swing,dx=s*cfg.track;const sw=r.querySelector('.rr126-swing'),pool=r.querySelector('.rr-v100-table-pool'),table=r.querySelector('.rr-table');imp(sw,'transform',`translateX(-50%) rotate(${angle}deg)`);if(pool)imp(pool,'left',(cfg.lightX+dx)+'%');if(table){imp(table,'--v100-table-x',(cfg.lightX+dx)+'%');imp(table,'--v105-table-x',(cfg.lightX+dx)+'%')}}else document.getElementById('status').textContent='Create/open a Russian Roulette game';raf=requestAnimationFrame(tick)}
function syncInputs(){specs.forEach(([,id])=>{const i=panel.querySelector(`[data-id="${id}"]`),o=panel.querySelector(`[data-out="${id}"]`);if(i)i.value=cfg[id];if(o)o.value=cfg[id]})}
document.getElementById('save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(cfg));document.getElementById('save').textContent='Saved';setTimeout(()=>document.getElementById('save').textContent='Save',800)};document.getElementById('copy').onclick=async()=>{const t=JSON.stringify(cfg,null,2);try{await navigator.clipboard.writeText(t)}catch{prompt('Copy settings',t)}};document.getElementById('reset').onclick=()=>{cfg={...defaults};syncInputs();apply()};document.getElementById('center').onclick=()=>{const r=root(),t=r?.querySelector('.rr-table'),g=r?.querySelector('.rr-gun-motion');if(!t||!g)return;const tr=t.getBoundingClientRect(),gr=g.getBoundingClientRect();cfg.lightX=((gr.left+gr.width/2-tr.left)/tr.width)*100;syncInputs();apply()};
document.getElementById('game').addEventListener('load',()=>setTimeout(apply,1200));setInterval(apply,1200);raf=requestAnimationFrame(tick);
</script></body></html>
