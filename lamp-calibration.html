<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lamp Calibration</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{border:0;width:100%;height:100%;display:block}#toggle{position:fixed;right:10px;top:150px;z-index:9;padding:12px 15px;border:2px solid #f2a13b;border-radius:12px;background:#1a120c;color:#ffd695;font:800 14px system-ui}#panel{display:none;position:fixed;right:8px;top:205px;z-index:10;width:min(370px,calc(100vw - 16px));max-height:calc(100vh - 220px);overflow:auto;box-sizing:border-box;padding:14px;border:2px solid #b96c24;border-radius:14px;background:#0c0907f7;color:#eee;font:13px system-ui}#panel.open{display:block}.row{display:grid;grid-template-columns:105px 1fr 46px;gap:8px;align-items:center;margin:9px 0}.row input{width:100%}output{color:#ffbd66;text-align:right}button.action{margin:5px;padding:8px 10px;border:1px solid #a86225;border-radius:8px;background:#332116;color:#ffe1aa;font-weight:800}#status{position:fixed;left:8px;bottom:8px;z-index:11;background:#111d;color:#ffd695;border:1px solid #b96c24;border-radius:8px;padding:7px 10px;font:700 12px system-ui}</style></head><body><iframe id="game" src="./?lampCalibration=4"></iframe><button id="toggle">LAMP CALIBRATION</button><section id="panel"><h3>Visible lamp calibration</h3><div id="rows"></div><button class="action" id="center">Center light on gun</button><button class="action" id="save">Save</button><button class="action" id="copy">Copy JSON</button><button class="action" id="reset">Reset</button><p><small>The rectangular blend layer stays disabled. A clipped amber underside fill restores the missing center of the shade without creating a box.</small></p></section><div id="status">Loading…</div><script>
const f=document.getElementById('game'),p=document.getElementById('panel'),status=document.getElementById('status');
const defs={lampX:[50,30,70,.25],lampY:[0,-80,100,1],lampScale:[1,.55,1.55,.01],chainHeight:[25,8,55,.5],swing:[1.35,0,8,.05],speed:[5.6,1.5,12,.1],undersideWidth:[44,20,70,1],undersideY:[84,75,96,.25],undersideGlow:[.82,0,1,.01],lightX:[50,15,85,.5],lightY:[43,15,85,.5],spreadX:[58,25,100,1],spreadY:[64,25,120,1],strength:[.55,.1,1,.01],wallDark:[.72,.1,.95,.01],gunGleam:[.25,0,.8,.01],track:[6,0,14,.25]};
let cfg=Object.fromEntries(Object.entries(defs).map(([k,v])=>[k,v[0]]));try{Object.assign(cfg,JSON.parse(localStorage.rrLampCalibration||'{}'))}catch{}
const rows=document.getElementById('rows');for(const[k,d]of Object.entries(defs)){const r=document.createElement('label');r.className='row';r.innerHTML=`<span>${k}</span><input type="range" min="${d[1]}" max="${d[2]}" step="${d[3]}" value="${cfg[k]}" data-k="${k}"><output>${cfg[k]}</output>`;rows.append(r)}
function doc(){try{return f.contentDocument}catch{return null}}
function install(){const d=doc();if(!d)return false;let s=d.getElementById('rrLampCalibrationDirect');if(!s){s=d.createElement('style');s.id='rrLampCalibrationDirect';s.textContent=`
[data-roulette-game] .rr126-swing{isolation:auto!important}
[data-roulette-game] .rr126-bulb-glow{display:none!important;opacity:0!important;background:none!important;box-shadow:none!important;filter:none!important;mix-blend-mode:normal!important}
[data-roulette-game] .rr126-swing::after{content:""!important;display:block!important;position:absolute!important;left:50%!important;top:var(--cal-under-y,84%)!important;width:var(--cal-under-w,44%)!important;height:13%!important;transform:translate(-50%,-50%)!important;border-radius:50%!important;clip-path:ellipse(50% 48% at 50% 50%)!important;background:radial-gradient(ellipse at 50% 18%,rgba(255,252,224,calc(var(--cal-under-g,.82)*.94)) 0 8%,rgba(255,211,123,calc(var(--cal-under-g,.82)*.95)) 24%,rgba(255,143,36,calc(var(--cal-under-g,.82)*.78)) 52%,rgba(190,61,8,calc(var(--cal-under-g,.82)*.28)) 73%,transparent 88%)!important;filter:blur(.35px)!important;box-shadow:0 0 10px rgba(255,201,99,calc(var(--cal-under-g,.82)*.4)),0 0 25px rgba(255,121,29,calc(var(--cal-under-g,.82)*.18))!important;mix-blend-mode:normal!important;pointer-events:none!important;z-index:4!important}
[data-roulette-game] .rr126-lamp-rig{--cal-lamp-x:50%;--cal-lamp-y:0px;--cal-lamp-scale:1;--cal-chain-height:25%}
[data-roulette-game] .rr126-chain{left:var(--cal-lamp-x)!important;height:var(--cal-chain-height)!important}
[data-roulette-game] .rr126-swing{left:var(--cal-lamp-x)!important;top:calc(20% + var(--cal-lamp-y))!important;scale:var(--cal-lamp-scale)}
[data-roulette-game] .rr130-table-illumination{background:radial-gradient(ellipse var(--cal-rx,58%) var(--cal-ry,64%) at var(--cal-x,50%) var(--cal-y,43%),rgba(255,226,166,var(--cal-s,.55)) 0,rgba(255,145,48,calc(var(--cal-s,.55)*.55)) 38%,rgba(150,43,5,calc(var(--cal-s,.55)*.15)) 68%,transparent 94%)!important}
[data-roulette-game]::after{opacity:var(--cal-wall,.72)!important}`;d.head.append(s)}return true}
function apply(){const d=doc();if(!d||!install())return;const g=d.querySelector('[data-roulette-game]'),rig=d.querySelector('.rr126-lamp-rig'),sw=d.querySelector('.rr126-swing'),light=d.querySelector('.rr130-table-illumination'),gun=d.querySelector('.rr-gun-motion');if(!g||!sw){status.textContent='Start/open a Russian Roulette game';return}rig?.style.setProperty('--cal-lamp-x',cfg.lampX+'%');rig?.style.setProperty('--cal-lamp-y',cfg.lampY+'px');rig?.style.setProperty('--cal-lamp-scale',cfg.lampScale);rig?.style.setProperty('--cal-chain-height',cfg.chainHeight+'%');sw.style.animationDuration=cfg.speed+'s';sw.style.setProperty('--cal-under-w',cfg.undersideWidth+'%');sw.style.setProperty('--cal-under-y',cfg.undersideY+'%');sw.style.setProperty('--cal-under-g',cfg.undersideGlow);if(light){light.style.setProperty('--cal-x',cfg.lightX+'%');light.style.setProperty('--cal-y',cfg.lightY+'%');light.style.setProperty('--cal-rx',cfg.spreadX+'%');light.style.setProperty('--cal-ry',cfg.spreadY+'%');light.style.setProperty('--cal-s',cfg.strength)}g.style.setProperty('--cal-wall',cfg.wallDark);if(gun)gun.style.filter=`brightness(1.02) contrast(1.08) drop-shadow(0 12px 12px #000b) drop-shadow(0 -2px ${8+cfg.gunGleam*20}px rgba(255,145,44,${cfg.gunGleam}))`;status.textContent='Connected — shade underside restored without box'}
rows.addEventListener('input',e=>{if(!e.target.dataset.k)return;cfg[e.target.dataset.k]=+e.target.value;e.target.nextElementSibling.value=e.target.value;apply()});toggle.onclick=()=>p.classList.toggle('open');save.onclick=()=>{localStorage.rrLampCalibration=JSON.stringify(cfg);status.textContent='Saved'};copy.onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(cfg,null,2));status.textContent='JSON copied'};reset.onclick=()=>{cfg=Object.fromEntries(Object.entries(defs).map(([k,v])=>[k,v[0]]));localStorage.removeItem('rrLampCalibration');location.reload()};center.onclick=()=>{const d=doc(),t=d?.querySelector('.rr-table'),g=d?.querySelector('.rr-gun-motion');if(!t||!g)return;const a=t.getBoundingClientRect(),b=g.getBoundingClientRect();cfg.lightX=(b.left+b.width/2-a.left)/a.width*100;cfg.lightY=(b.top+b.height/2-a.top)/a.height*100;for(const k of['lightX','lightY']){const i=rows.querySelector(`[data-k="${k}"]`);i.value=cfg[k];i.nextElementSibling.value=cfg[k].toFixed(1)}apply()};f.onload=()=>{setTimeout(apply,800);setInterval(apply,1500)};
</script></body></html>
