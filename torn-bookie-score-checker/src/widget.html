<div id="app" class="tracker-shell">
  <div class="summary-grid" id="summary"></div>
  <div class="toolbar">
    <div>
      <div class="eyebrow">TORN BOOKIE</div>
      <div class="title">Pending Bet Score Tracker</div>
      <div class="muted" id="lastChecked">Ready to check scores.</div>
    </div>
    <button id="checkButton" type="button">Check Scores Now</button>
  </div>
  <div id="error" class="error" hidden></div>
  <div id="bets" class="bets"></div>
  <div class="footer">Data from <a href="https://sportscore.com/" rel="dofollow" target="_blank">SportScore</a> + <a href="https://www.thesportsdb.com/" target="_blank">TheSportsDB</a> · Provider freshness and coverage vary by sport.</div>
</div>
<style>
  :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .tracker-shell { padding: 14px; color: CanvasText; background: Canvas; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin: 12px 0; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.12em; opacity:.6; }
  .title { font-size:18px; font-weight:750; margin-top:2px; }
  .muted { opacity:.62; font-size:12px; margin-top:3px; }
  button { border:0; border-radius:12px; padding:11px 14px; background:#1677ff; color:#fff; font:700 14px system-ui; cursor:pointer; white-space:nowrap; }
  button[disabled] { opacity:.55; cursor:wait; }
  .summary-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .metric { border:1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius:12px; padding:9px; }
  .metric-label { font-size:11px; opacity:.6; }
  .metric-value { font-size:16px; font-weight:750; margin-top:2px; }
  .bets { display:grid; gap:10px; }
  .bet { border:1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius:14px; overflow:hidden; }
  .bet-head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 12px; border-bottom:1px solid color-mix(in srgb, CanvasText 11%, transparent); }
  .matchup { font-size:14px; font-weight:700; }
  .event { font-size:11px; opacity:.55; margin-top:2px; }
  .badge { font-size:11px; font-weight:750; border-radius:999px; padding:5px 8px; border:1px solid currentColor; }
  .LIVE { color:#d93025; }
  .FINAL { color:#188038; }
  .UPCOMING { color:#7a5e00; }
  .DELAYED, .POSTPONED { color:#b26a00; }
  .SUSPENDED { color:#8a5a00; }
  .CANCELLED, .ABANDONED { color:#b3261e; }
  .WALKOVER { color:#6f42c1; }
  .UNKNOWN { opacity:.65; }
  .players { padding:6px 12px; }
  .player { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:8px 0; }
  .player + .player { border-top:1px solid color-mix(in srgb, CanvasText 8%, transparent); }
  .picked { font-weight:800; }
  .picked::before { content:"★ "; color:#e3a008; }
  .score { font-variant-numeric:tabular-nums; font-weight:800; font-size:17px; }
  .details { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:10px 12px; background:color-mix(in srgb, CanvasText 4%, transparent); }
  .detail-label { font-size:10px; opacity:.55; text-transform:uppercase; letter-spacing:.06em; }
  .detail-value { font-size:12px; font-weight:650; margin-top:2px; overflow-wrap:anywhere; }
  .condition { margin:0 12px 11px; padding:9px 10px; border-radius:10px; background:color-mix(in srgb, #1677ff 10%, transparent); font-size:12px; }
  .note { padding:0 12px 11px; font-size:11px; opacity:.6; }
  .result-WIN { color:#188038; font-weight:800; }
  .result-LOSS { color:#d93025; font-weight:800; }
  .error { margin:10px 0; border:1px solid #d93025; color:#d93025; border-radius:10px; padding:9px; font-size:12px; }
  .footer { font-size:10px; opacity:.6; text-align:center; margin-top:10px; }
  .footer a { color:inherit; font-weight:700; }
  @media (max-width:520px) {
    .summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .toolbar { align-items:flex-start; flex-direction:column; }
    button { width:100%; }
    .details { grid-template-columns:1fr 1fr; }
  }
</style>
<script>
(() => {
  const summaryEl = document.getElementById("summary");
  const betsEl = document.getElementById("bets");
  const checkButton = document.getElementById("checkButton");
  const errorEl = document.getElementById("error");
  const lastCheckedEl = document.getElementById("lastChecked");
  const pendingRequests = new Map();
  let nextRequestId = 1;
  let currentData = null;

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const money = (n) => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
  const openai = window.openai;

  function request(method, params) {
    const id = nextRequestId++;
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return new Promise((resolve, reject) => pendingRequests.set(id, { resolve, reject }));
  }

  function toolCall(name, args) {
    if (openai?.callTool) return openai.callTool(name, args);
    return request("tools/call", { name, arguments: args });
  }

  function render(data) {
    if (!data || !Array.isArray(data.bets)) return;
    currentData = data;
    const s = data.summary || {};
    summaryEl.innerHTML = [
      ["Pending", s.pending ?? 0],
      ["Wins", s.wins ?? 0],
      ["Losses", s.losses ?? 0],
      ["Pending Return", money(s.potentialReturn ?? 0)]
    ].map(([label,value]) => `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div></div>`).join("");

    lastCheckedEl.textContent = data.checkedAt ? `Last checked ${new Date(data.checkedAt).toLocaleTimeString()}` : "Ready to check scores.";
    betsEl.innerHTML = data.bets.map((b) => {
      const p1Picked = String(b.pick).toLowerCase() === String(b.player1).toLowerCase();
      const p2Picked = String(b.pick).toLowerCase() === String(b.player2).toLowerCase();
      const result = b.result && b.result !== "PENDING" ? `<span class="result-${esc(b.result)}">${esc(b.result)}</span>` : esc(b.status || "Pending");
      return `<section class="bet">
        <div class="bet-head">
          <div><div class="matchup">${esc(b.matchup)}</div><div class="event">Event ${esc(b.eventId || "—")}</div></div>
          <span class="badge ${esc(b.statusKind || "UNKNOWN")}">${esc(b.statusKind || "UNKNOWN")}</span>
        </div>
        <div class="players">
          <div class="player"><span class="${p1Picked ? "picked" : ""}">${esc(b.player1 || "Player 1")}</span><span class="score">${esc(b.player1Score || "—")}</span></div>
          <div class="player"><span class="${p2Picked ? "picked" : ""}">${esc(b.player2 || "Player 2")}</span><span class="score">${esc(b.player2Score || "—")}</span></div>
          ${b.setsText ? `<div class="muted">${esc(b.setsText)}</div>` : ""}
        </div>
        <div class="details">
          <div><div class="detail-label">Your bet</div><div class="detail-value">${esc(b.pick)} ${esc(b.market)} @ ${esc(b.odds)}</div></div>
          <div><div class="detail-label">Stake</div><div class="detail-value">${money(b.stake)}</div></div>
          <div><div class="detail-label">State</div><div class="detail-value">${result}</div></div>
          ${b.competition ? `<div><div class="detail-label">Competition</div><div class="detail-value">${esc(b.competition)}</div></div>` : ""}
          ${b.startTime ? `<div><div class="detail-label">Start</div><div class="detail-value">${esc(b.startTime)}</div></div>` : ""}
          ${b.provider ? `<div><div class="detail-label">Source</div><div class="detail-value">${esc(b.provider)}</div></div>` : ""}
          <div><div class="detail-label">Potential return</div><div class="detail-value">${money(Number(b.stake) * Number(b.odds))}</div></div>
        </div>
        <div class="condition"><strong>To win:</strong> ${esc(b.winCondition)}</div>
        ${b.note ? `<div class="note">${esc(b.note)}</div>` : ""}
      </section>`;
    }).join("");
  }

  async function checkScores() {
    const bets = currentData?.bets?.map(({ found, status, statusKind, player1, player2, player1Score, player2Score, scoreText, setsText, competition, startTime, sourceUrl, provider, sourcesChecked, result, note, ...bet }) => bet) || [];
    checkButton.disabled = true;
    checkButton.textContent = "Checking…";
    errorEl.hidden = true;
    try {
      const response = await toolCall("check_scores", { bets });
      const next = response?.structuredContent || response?.result?.structuredContent || response;
      if (!next?.bets) throw new Error("The score tool returned no tracker data.");
      render(next);
    } catch (error) {
      errorEl.hidden = false;
      errorEl.textContent = error?.message || String(error);
    } finally {
      checkButton.disabled = false;
      checkButton.textContent = "Check Scores Now";
    }
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pendingRequests.has(msg.id)) {
      const pending = pendingRequests.get(msg.id);
      pendingRequests.delete(msg.id);
      if (msg.error) pending.reject(msg.error); else pending.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") {
      const result = msg.params?.structuredContent;
      if (result?.bets) render(result);
    }
  }, { passive: true });

  checkButton.addEventListener("click", checkScores);

  const initial = openai?.toolOutput;
  if (initial?.bets) render(initial);
})();
</script>
