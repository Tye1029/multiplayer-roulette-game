<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blackjack Duel — Component Preview</title>
  <link rel="stylesheet" href="/assets/blackjack-duel/blackjack-duel.css">
  <style>
    html, body { min-height: 100%; margin: 0; background: #070b16; }
    body { display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
    [data-blackjack-duel-mount] { width: min(100%, 980px); }
    /* Mirrors the shared site rule that Blackjack Duel must override. */
    .win { color: #1b001e; background: linear-gradient(90deg, #fff4a3, #59ff97, #39f7ff) !important; animation: previewSharedPulse 900ms ease-in-out infinite alternate; }
    @keyframes previewSharedPulse { to { transform: scale(1.015); filter: brightness(1.16); } }
  </style>
</head>
<body>
  <main data-blackjack-duel-mount aria-label="Blackjack Duel component preview"></main>
  <script src="/assets/blackjack-duel/blackjack-duel.js"></script>
  <script>
    const previewState = new URLSearchParams(location.search).get("state") || "playing";
    const previewOutcome = new URLSearchParams(location.search).get("outcome") || "tie";
    const previewParams = new URLSearchParams(location.search);
    const previewWager = Math.max(1, Number(previewParams.get("wager")) || 2500);
    const previewPlayerName = previewParams.get("playerName") || "You";
    const previewOpponentName = previewParams.get("opponentName") || "Remote Network Bot";
    const complete = previewState === "complete";
    const countdown = previewState === "countdown";
    const previewGame = {
      mode: "blackjackduel",
      status: complete ? "complete" : countdown ? "countdown" : "playing",
      gameId: "blackjack-duel-preview",
      pot: previewParams.get("singlePot") === "1" ? previewWager : previewWager * 2,
      wager: previewWager,
      tie: complete && previewOutcome === "tie",
      winnerUserId: complete && previewOutcome !== "tie" ? (previewOutcome === "win" ? "preview-player" : "preview-bot") : "",
      payout: complete && previewOutcome === "win" ? (previewParams.get("singlePot") === "1" ? previewWager : previewWager * 2) : 0,
      isCreator: true,
      creator: { userId: "preview-player", name: previewPlayerName, avatarUrl: "" },
      joiner: { userId: "preview-bot", name: previewOpponentName, avatarUrl: "", isRemoteBot: true },
      serverNow: new Date().toISOString(),
      startAt: new Date(Date.now() + 4000).toISOString(),
      countdownSeconds: 4,
      blackjackDuelState: {
        roundId: "preview-round",
        completedAt: complete ? new Date().toISOString() : null,
        secondsLeft: complete ? 0 : 19,
        deadlineAt: new Date(Date.now() + (complete ? -1000 : 19000)).toISOString(),
        deckCommitment: "preview-commitment-not-a-secret",
        opponentName: previewOpponentName,
        opponent: complete
          ? { cards: [{ rank: "10", suit: "clubs" }, { rank: previewOutcome === "tie" ? "8" : "7", suit: "diamonds" }], total: previewOutcome === "tie" ? 18 : 17, status: "stand" }
          : { cards: [{ hidden: true }, { hidden: true }], total: null, status: "active" },
        me: {
          cards: [{ rank: "A", suit: "spades" }, { rank: "7", suit: "hearts" }],
          total: 18,
          soft: true,
          status: complete ? "stand" : "active"
        },
        canHit: !complete,
        canStand: !complete
      }
    };
    let previewDealAnimationStarts = 0;
    document.addEventListener("animationstart", event => {
      if (!event.target?.classList?.contains("bjd-card")) return;
      previewDealAnimationStarts += 1;
      document.documentElement.setAttribute("data-preview-deal-animation-starts", String(previewDealAnimationStarts));
    }, true);
    const applyPreviewDoubleOffer = () => {
      previewGame.rematch = {
        kind: "double-or-nothing",
        requestedBy: { "preview-player": new Date().toISOString() },
        firstRequestedAt: new Date().toISOString(),
        expiresAt: new Date(Date.now() + 5000).toISOString()
      };
      window.dispatchEvent(new CustomEvent("blackjackduel:state", { detail: { game: previewGame } }));
      if (previewParams.get("acceptDouble") === "1") {
        setTimeout(() => {
          previewGame.gameId = "blackjack-duel-preview-doubled";
          previewGame.status = "countdown";
          previewGame.tie = false;
          previewGame.wager *= 2;
          previewGame.pot = previewGame.wager * 2;
          previewGame.rematch = null;
          previewGame.serverNow = new Date().toISOString();
          previewGame.startAt = new Date(Date.now() + 4000).toISOString();
          previewGame.countdownSeconds = 4;
          previewGame.blackjackDuelState.completedAt = null;
          window.dispatchEvent(new CustomEvent("blackjackduel:state", { detail: { game: previewGame } }));
        }, 450);
      }
    };
    window.__blackjackDuelBridge = {
      submit: details => new Promise(resolve => setTimeout(() => {
        if (String(details?.choice || "").endsWith(":hit") && previewGame.blackjackDuelState.me.cards.length === 2) {
          previewGame.blackjackDuelState.me.cards.push({ rank: "2", suit: "clubs" });
          previewGame.blackjackDuelState.me.total = 20;
          previewGame.blackjackDuelState.me.soft = true;
        }
        resolve({ game: previewGame });
      }, 650)),
      refresh: () => {},
      rematch: () => {},
      doubleOrNothing: () => {
        if (previewParams.get("delayDouble") === "1") return new Promise(resolve => setTimeout(() => { applyPreviewDoubleOffer(); resolve(); }, 1800));
        applyPreviewDoubleOffer();
        return Promise.resolve();
      },
      pushRestart: () => {
        previewGame.gameId = "blackjack-duel-preview-push-restart";
        previewGame.status = "countdown";
        previewGame.tie = false;
        previewGame.rematch = null;
        previewGame.serverNow = new Date().toISOString();
        previewGame.startAt = new Date(Date.now() + 4000).toISOString();
        previewGame.countdownSeconds = 4;
        previewGame.blackjackDuelState.completedAt = null;
        window.dispatchEvent(new CustomEvent("blackjackduel:state", { detail: { game: previewGame } }));
      },
      newGame: () => {}
    };
    window.dispatchEvent(new CustomEvent("blackjackduel:state", { detail: { game: previewGame } }));
    if (countdown && previewParams.get("autoDeal") === "1") {
      setTimeout(() => {
        previewGame.status = "playing";
        previewGame.countdownSeconds = 0;
        window.dispatchEvent(new CustomEvent("blackjackduel:state", { detail: { game: previewGame } }));
      }, 650);
      if (previewParams.get("repeatMount") === "1") {
        setTimeout(() => {
          const mounted = document.querySelector("[data-blackjack-duel-mount]");
          if (mounted) mounted.replaceWith(mounted.cloneNode(false));
          window.dispatchEvent(new CustomEvent("blackjackduel:state", { detail: { game: previewGame } }));
        }, 2000);
      }
    }
    if (previewParams.get("poll") === "1") {
      setInterval(() => window.dispatchEvent(new CustomEvent("blackjackduel:state", { detail: { game: previewGame } })), 250);
    }
  </script>
</body>
</html>
