name: Temporary Cleanup Repair

on:
  push:
    branches: [lamp-development]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
          fetch-depth: 0
      - name: Remove accidentally committed dependencies and restore source outputs
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -f --ignore-unmatch node_modules
          git checkout 357f84c967c2987a6299bf9a67965102fca2dd9b -- \
            index.html \
            assets/roulette/audio-manager.js \
            assets/roulette/spin-audio-policy.js \
            netlify/functions/_data.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies for validation only
        run: npm install --package-lock=false
      - name: Validate cleaned branch
        run: npm run build
      - name: Verify protected animation hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
      - name: Restore source form and commit repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout 357f84c967c2987a6299bf9a67965102fca2dd9b -- \
            index.html \
            assets/roulette/audio-manager.js \
            assets/roulette/spin-audio-policy.js \
            netlify/functions/_data.js
          rm -rf node_modules
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair cleanup commit and remove generated files [repair-cleanup]"
          git push origin HEAD:lamp-development
