name: Safe Cracker Build Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build command
        run: npm run build
      - name: Verify live Netlify preview
        shell: bash
        run: |
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq 'class="sth-game" data-mode="safecracker"' <<<"$html" && \
               grep -Fq 'data-rnb-game="safecracker"' <<<"$html" && \
               grep -Fq 'id="safe-cracker-compact-debug-dock"' <<<"$html" && \
               grep -Fq 'id="rnbControlPanel" data-collapsed="1"' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_SNAPSHOT_GUARD_START' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_READY_RETRY_START' <<<"$html" && \
               grep -Fq 'const deadlineAt = Date.now() + 12000' <<<"$html" && \
               grep -Fq 'window.__safeCrackerFocusedGetAbort' <<<"$html" && \
               grep -Fq 'game.status === "playing" ? 2200 : 650' <<<"$html" && \
               grep -Fq 'DUEL_COMPLETED_DISMISSAL_START' <<<"$html" && \
               grep -Fq 'duel-end-screen-close' <<<"$html" && \
               grep -Fq 'torn-duel-completed-seen-v1' <<<"$html" && \
               grep -Fq '/assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=1' <<<"$html" && \
               grep -Fq '/assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=1' <<<"$html" && \
               grep -Fq "if(game.mode==='safecracker')" <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_START_COUNTDOWN_START' <<<"$js" && \
               grep -Fq 'data-sc-start-countdown' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_PHYSICS_V2_START' <<<"$js" && \
               grep -Fq 'animateDialSettle(releasedRotation, runtime.rotation, runtime.lastDragDirection)' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_HUD_V3_START' <<<"$js" && \
               grep -Fq 'class="sc-display-glass"' <<<"$js" && \
               grep -Fq 'class="sc-stage-bolt"' <<<"$js" && \
               grep -Fq 'class="sc-race-progress"' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_SEQUENCE_V4_START' <<<"$js" && \
               grep -Fq 'data-sc-countdown-value' <<<"$js" && \
               grep -Fq 'data-sc-result-sequence' <<<"$js" && \
               grep -Fq 'class="sc-result-vault-light"' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_VISUAL_STABILITY_V5_START' <<<"$js" && \
               grep -Fq 'function lockedCode(progress = {})' <<<"$js" && \
               grep -Fq "confirmButton.classList.add('busy')" <<<"$js" && \
               grep -Fq 'runtime.visualStatus === visualStatus;' <<<"$js" && \
               ! grep -Fq 'runtime.visualStatus === visualStatus && !stageChanged' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_VIEWPORT_FIT_V7_START' <<<"$js" && \
               grep -Fq 'function centerCountdownViewport(game, mount)' <<<"$js" && \
               grep -Fq "target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });" <<<"$js" && \
               ! grep -Fq 'class="sc-attempt-panel"' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_VISUAL_SHELL_V1_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_VISUAL_DIAL_V2_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_VISUAL_HUD_V3_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_VISUAL_SEQUENCE_V4_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_VISUAL_STABILITY_V5_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_MOBILE_FIT_V6_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_VIEWPORT_FIT_V7_START' <<<"$css" && \
               grep -Fq '.sc-player-card.me .sc-progress-lights' <<<"$css" && \
               grep -Fq '.sc-safe-handle {' <<<"$css" && \
               grep -Fq 'grid-template-columns: minmax(0, 1fr)' <<<"$css" && \
               grep -Fq 'height: 100dvh !important' <<<"$css" && \
               grep -Fq 'z-index: 20' <<<"$css" && \
               grep -Fq 'linear-gradient(90deg, #20282c, #4c3a20 48%, #20282c)' <<<"$css" && \
               grep -Fq '.sc-known-code span.known' <<<"$css" && \
               grep -Fq -- '-webkit-tap-highlight-color: transparent' <<<"$css" && \
               grep -Fq '@keyframes scResultDoorOpen' <<<"$css" && \
               grep -Fq '.sc-countdown-vault' <<<"$css" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker viewport-fit polish, all visual passes, v8 immediate completion, result dismissal, Ready, countdown, and snapshot safeguards at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker viewport-fit v7 preview (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the Safe Cracker viewport-fit polish and current gameplay fixes.' >&2
          exit 1