name: Safe Cracker Build Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build command
        run: npm run build
      - name: Verify live Netlify preview
        shell: bash
        run: |
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq 'class="sth-game" data-mode="safecracker"' <<<"$html" && \
               grep -Fq 'data-rnb-game="safecracker"' <<<"$html" && \
               grep -Fq 'id="safe-cracker-compact-debug-dock"' <<<"$html" && \
               grep -Fq 'id="rnbControlPanel" data-collapsed="1"' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_SNAPSHOT_GUARD_START' <<<"$html" && \
               grep -Fq 'function rnbDebugState(g)' <<<"$html" && \
               grep -Fiq 'x-duel-function-build: safecracker-remote-bot-v2' <<<"$headers"; then
              echo "Verified live Safe Cracker snapshot guard, debug state, compact controls, and fresh Remote Bot function at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify preview and function bundle (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the Safe Cracker snapshot/debug fixes and fresh function bundle.' >&2
          exit 1
