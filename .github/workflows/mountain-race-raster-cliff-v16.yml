name: Summit Sprint Raster Cliff V16

on:
  workflow_dispatch:

concurrency:
  group: summit-sprint-raster-cliff-v16-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-raster-cliff:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build exact Netlify output
        run: npm run build

      - name: Verify raster cliff and authoritative protections
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-mountain-race-raster-cliff-v16.mjs
          node --check scripts/validate-mountain-race-raster-cliff-v16.mjs
          node --check assets/mountain-race/mountain-race-multiplayer.js
          node scripts/validate-mountain-race-raster-cliff-v16.mjs
          node scripts/validate-mountain-race-daylight-terrain-v15.mjs
          node scripts/validate-mountain-race-visual-rebuild-v14.mjs
          node scripts/validate-mountain-race-input-rebase-v8.mjs
          node scripts/validate-mountain-race-terminal-poll-v10.mjs
          node scripts/validate-mountain-race-lifecycle-guard-v11.mjs
          grep -Fq 'MOUNTAIN_RACE_RASTER_CLIFF_V16' index.html
          grep -Fq 'texture=16' index.html
          grep -Fq 'function createMountainRasterV16()' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function createHoldSpriteV16()' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq "canvas.toDataURL('image/png')" assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'window.__mountainRaceRasterAssetsV16' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'ensureMountainRaceRasterAssetsV16(root)' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq -- '--mr-mountain-raster-v16' assets/mountain-race/mountain-race.css
          grep -Fq -- '--mr-hold-sprite-v16' assets/mountain-race/mountain-race.css
          grep -Fq 'background-size: 600% 100%' assets/mountain-race/mountain-race.css
          grep -Fq '.mr-rock-hold:nth-of-type(6n + 1)' assets/mountain-race/mountain-race.css
          grep -Fq 'standing-on-summit' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'class="mr-start-meadow"' assets/mountain-race/mountain-race-multiplayer.js
          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/roulette/turn-animation.js

      - name: Verify live Netlify Raster Cliff V16 deployment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'
          for attempt in $(seq 1 48); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_raster_cliff_v16=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?visual=14&terrain=15&texture=16&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            styles="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race.css?visual=14&terrain=15&texture=16&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq 'MOUNTAIN_RACE_RASTER_CLIFF_V16' <<<"$page" && \
               grep -Fq 'texture=16' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_RASTER_CLIFF_V16' <<<"$runtime" && \
               grep -Fq 'function createMountainRasterV16()' <<<"$runtime" && \
               grep -Fq 'function createHoldSpriteV16()' <<<"$runtime" && \
               grep -Fq "canvas.toDataURL('image/png')" <<<"$runtime" && \
               grep -Fq 'ensureMountainRaceRasterAssetsV16(root)' <<<"$runtime" && \
               grep -Fq 'MOUNTAIN_RACE_RASTER_CLIFF_V16' <<<"$styles" && \
               grep -Fq -- '--mr-mountain-raster-v16' <<<"$styles" && \
               grep -Fq -- '--mr-hold-sprite-v16' <<<"$styles"; then
              echo 'Verified live Summit Sprint Raster Cliff V16 deployment.'
              exit 0
            fi
            echo "Waiting for Netlify Raster Cliff V16 deployment (${attempt}/48)..."
            sleep 10
          done
          echo 'Netlify did not serve Summit Sprint Raster Cliff V16.' >&2
          exit 1
