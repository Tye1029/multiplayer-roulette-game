name: Boardwalk Party
on:
  push:
    branches: [mountain-race-development]
  pull_request:
    branches: [safe-cracker-development]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    # Ten board turns, dedicated rival duels and all 30 rendered minigames.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-package-lock
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.3.14 playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/party.test.mjs scripts/party-v5.test.mjs
      - run: npm run build
      - run: node scripts/party-browser.test.mjs
      - run: node scripts/party-v4-browser.test.mjs
      - run: node scripts/party-v5-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: boardwalk-party-screens
          path: /tmp/boardwalk-party-qa
          retention-days: 7
