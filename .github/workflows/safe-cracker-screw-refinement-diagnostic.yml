name: Safe Cracker Screw Refinement Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  screw-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated Phillips screws
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-screw-refinement.mjs
          screw="$(sed -n '/SAFE_CRACKER_SCREW_REFINEMENT_V1_START/,/SAFE_CRACKER_SCREW_REFINEMENT_V1_END/p' assets/safe-cracker/safe-cracker.css)"
          grep -Fq '.sc-door-screws' <<<"$screw"
          grep -Fq '.sc-display-bezel i::before' <<<"$screw"
          grep -Fq '.sc-display-bezel i::after' <<<"$screw"
          grep -Fq '.sc-door-screws i::before' <<<"$screw"
          grep -Fq '.sc-door-screws i::after' <<<"$screw"
          grep -Fq "url('./brushed-metal-horizontal-v1.svg?grain=1')" <<<"$screw"
          grep -Fq 'rgba(255,255,255,.56)' <<<"$screw"
          grep -Fq 'background-blend-mode: soft-light, screen, normal, normal' <<<"$screw"
          grep -Fq 'class="sc-door-screws" aria-hidden="true"><i></i><i></i><i></i><i></i>' assets/safe-cracker/safe-cracker.js
          grep -Fq '&screw=1' index.html
          grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' assets/safe-cracker/safe-cracker.js

      - name: Verify live Netlify Phillips screws
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "${url}?screw_refinement=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.css?v=8&polish=2&dial=7&layout=7&latch=9&screw=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&dial=7&layout=7&latch=9&screw=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            screw="$(sed -n '/SAFE_CRACKER_SCREW_REFINEMENT_V1_START/,/SAFE_CRACKER_SCREW_REFINEMENT_V1_END/p' <<<"$css")"

            if grep -Fq '&screw=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_SCREW_REFINEMENT_V1_START' <<<"$css" && \
               grep -Fq '.sc-door-screws' <<<"$screw" && \
               grep -Fq '.sc-display-bezel i::before' <<<"$screw" && \
               grep -Fq '.sc-door-screws i::after' <<<"$screw" && \
               grep -Fq "url('./brushed-metal-horizontal-v1.svg?grain=1')" <<<"$screw" && \
               grep -Fq 'rgba(255,255,255,.56)' <<<"$screw" && \
               grep -Fq 'class="sc-door-screws" aria-hidden="true"><i></i><i></i><i></i><i></i>' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live brushed Phillips screws on all Safe Cracker display and door corners at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker screw refinement (${attempt}/42)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the brushed Phillips screw refinement.' >&2
          exit 1
