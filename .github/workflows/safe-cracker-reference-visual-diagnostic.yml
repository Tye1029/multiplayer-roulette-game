name: Safe Cracker Reference Visual Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and all regressions
        run: npm run build
      - name: Verify live Netlify reference visuals
        shell: bash
        run: |
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1&stability=1&reference=1'
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&reference=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?visual_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq "/${js_path}" <<<"$html" && \
               grep -Fq "/${css_path}" <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_REFERENCE_VISUALS_V13_START' <<<"$js" && \
               grep -Fq 'function safeCrackerMountReferenceFrame(game = runtime.game)' <<<"$js" && \
               grep -Fq 'SAFE CRACKER DUEL' <<<"$js" && \
               grep -Fq "root.classList.add('sc-reference-visuals')" <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_RUNTIME_STABILITY_V12_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_SAMPLE_MIX_V11_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_REFERENCE_VISUALS_V13_START' <<<"$css" && \
               grep -Fq '.safe-cracker-game.sc-reference-visuals .sc-safe-door::after' <<<"$css" && \
               grep -Fq '.safe-cracker-game.sc-reference-visuals .sc-dial::before' <<<"$css" && \
               grep -Fq '.sc-reference-title' <<<"$css" && \
               grep -Fq '.sc-reference-pot' <<<"$css" && \
               grep -Fq 'mix-blend-mode: screen' <<<"$css" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker reference visuals v13, runtime stability, sample mix, full Safe Cracker regression, and protected Roulette regression at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker reference-visual-v13 preview (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the Safe Cracker reference visuals v13 and current gameplay safeguards.' >&2
          exit 1
