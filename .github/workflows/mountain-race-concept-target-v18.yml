name: Summit Sprint Concept Target V18

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-concept-target-v18-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-concept-target:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build exact Netlify output
        run: npm run build

      - name: Verify concept target and authoritative protections
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-mountain-race-concept-target-v18.mjs
          node --check scripts/validate-mountain-race-concept-target-v18.mjs
          node --check assets/mountain-race/mountain-race-multiplayer.js
          node --check netlify/functions/mountain-race/integration.js
          node --check netlify/functions/duel-action.js

          node scripts/validate-mountain-race-concept-target-v18.mjs
          node scripts/validate-mountain-race-environment-polish-v17.mjs
          node scripts/validate-mountain-race-raster-cliff-v16.mjs
          node scripts/validate-mountain-race-daylight-terrain-v15.mjs
          node scripts/validate-mountain-race-visual-rebuild-v14.mjs
          node scripts/validate-mountain-race-input-rebase-v8.mjs
          node scripts/validate-mountain-race-terminal-poll-v10.mjs
          node scripts/validate-mountain-race-lifecycle-guard-v11.mjs
          node scripts/validate-mountain-race-state-sync.mjs
          node scripts/validate-mountain-race-load-performance.mjs

          grep -Fq 'MOUNTAIN_RACE_CONCEPT_TARGET_V18' index.html
          grep -Fq 'MOUNTAIN_RACE_CONCEPT_TARGET_V18' assets/mountain-race/mountain-race.css
          grep -Fq 'MOUNTAIN_RACE_CONCEPT_TARGET_V18' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function directionGlyphV18(value)' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'mr-direction-glyph-v18' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq "known ? symbol(known) : ''" assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'concept=18' index.html

          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify Concept Target V18 deployment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'
          for attempt in $(seq 1 48); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_concept_target_v18=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?concept=18&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            styles="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race.css?concept=18&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq 'MOUNTAIN_RACE_CONCEPT_TARGET_V18' <<<"$page" && \
               grep -Fq 'concept=18' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_CONCEPT_TARGET_V18' <<<"$runtime" && \
               grep -Fq 'mr-direction-glyph-v18' <<<"$runtime" && \
               grep -Fq 'MOUNTAIN_RACE_CONCEPT_TARGET_V18' <<<"$styles" && \
               grep -Fq '.mr-direction-glyph-v18' <<<"$styles"; then
              echo 'Verified live Summit Sprint Concept Target V18 deployment.'
              exit 0
            fi
            echo "Waiting for Netlify Concept Target V18 deployment (${attempt}/48)..."
            sleep 10
          done
          echo 'Netlify did not serve Summit Sprint Concept Target V18.' >&2
          exit 1
