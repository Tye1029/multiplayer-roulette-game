name: Admin balances
on:
  push:
    branches: [mountain-race-development]
    paths: ['admin.html', 'admin/**', 'scripts/admin-browser.test.mjs', '.github/workflows/admin.yml']
  pull_request:
    branches: [safe-cracker-development]
    paths: ['admin.html', 'admin/**', 'scripts/admin-browser.test.mjs', '.github/workflows/admin.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm install --no-save --no-package-lock playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/admin-browser.test.mjs
