name: Safe Cracker PNG Hybrid Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and all regressions
        run: npm run build
      - name: Verify live Netlify PNG hybrid
        shell: bash
        run: |
          set -u
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1&stability=1&reference=1&depth=1&png=1'
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&reference=1&depth=1&png=1'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          png_signature() { head -c 8 "$1" | od -An -tx1 | tr -d ' \n'; }
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?png_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            body_ok=0
            face_ok=0
            rim_ok=0
            if curl -fsSL --max-time 20 "${url}assets/safe-cracker/png-ui/safe-body.png?commit=${GITHUB_SHA}&attempt=${attempt}" -o "$work/safe-body.png" 2>/dev/null && \
               [ "$(wc -c < "$work/safe-body.png")" -gt 20000 ] && \
               [ "$(png_signature "$work/safe-body.png")" = '89504e470d0a1a0a' ]; then body_ok=1; fi
            if curl -fsSL --max-time 20 "${url}assets/safe-cracker/png-ui/dial-face.png?commit=${GITHUB_SHA}&attempt=${attempt}" -o "$work/dial-face.png" 2>/dev/null && \
               [ "$(wc -c < "$work/dial-face.png")" -gt 10000 ] && \
               [ "$(png_signature "$work/dial-face.png")" = '89504e470d0a1a0a' ]; then face_ok=1; fi
            if curl -fsSL --max-time 20 "${url}assets/safe-cracker/png-ui/dial-rim-pointer.png?commit=${GITHUB_SHA}&attempt=${attempt}" -o "$work/dial-rim-pointer.png" 2>/dev/null && \
               [ "$(wc -c < "$work/dial-rim-pointer.png")" -gt 10000 ] && \
               [ "$(png_signature "$work/dial-rim-pointer.png")" = '89504e470d0a1a0a' ]; then rim_ok=1; fi
            if grep -Fq '&reference=1&depth=1&png=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_PNG_HYBRID_V15_START' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/png-ui/safe-body.png' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/png-ui/dial-face.png' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/png-ui/dial-rim-pointer.png' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/png-ui/dial-hub.png' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/png-ui/button-minus.png' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/png-ui/button-plus.png' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/png-ui/button-check-frame.png' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_RUNTIME_STABILITY_V12_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               [ "$body_ok" -eq 1 ] && [ "$face_ok" -eq 1 ] && [ "$rim_ok" -eq 1 ] && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker PNG hybrid v15 and all protected regressions at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker PNG-hybrid-v15 preview (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with Safe Cracker PNG hybrid v15 and current safeguards.' >&2
          exit 1
