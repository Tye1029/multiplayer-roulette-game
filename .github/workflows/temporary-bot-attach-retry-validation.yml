name: Temporary Remote Bot and Audio Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run complete Netlify build
        run: npm run build
      - name: Verify one-click bot attachment recovery
        run: |
          grep -Fq 'function duelGetStrongStore()' netlify/functions/_data.js
          grep -Fq 'consistency: "strong"' netlify/functions/_data.js
          grep -Fq 'async function rnbAttachBotWithRetry(gameId,profile)' index.html
          grep -Fq 'const delays=[0,900,1500,2200,3000,3500];' index.html
          grep -Fq "line(botLogs,'attach retry scheduled'" index.html
          grep -Fq 'recoveredExistingBot:true' netlify/functions/_data.js
      - name: Verify approved turn sound and opening trim
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const guard = await readFile('assets/roulette/turn-facing-guard.js', 'utf8');
          const policy = await readFile('assets/roulette/spin-audio-policy.js', 'utf8');
          const bindings = await readFile('assets/roulette/audio-bindings.js', 'utf8');
          const sync = await readFile('assets/roulette/opening-spin-sync.js', 'utf8');
          const animation = await readFile('assets/roulette/turn-animation.js', 'utf8');

          const approved = guard.indexOf("recordDiagnostic('approved', transition)");
          const sound = guard.indexOf("startTurnMovementSound('approved-transition')", approved);
          const rotate = guard.indexOf('await api.rotateToLockedTurn(game, gameId, turnId, 1020)', sound);
          if (!(approved >= 0 && approved < sound && sound < rotate)) {
            throw new Error('Approved transition does not start sound before rotation.');
          }
          for (const required of [
            "startTurnMovementSound('animation-wrapper-fallback')",
            "recordDiagnostic('sound-started'",
            "recordDiagnostic('sound-deferred'",
            'if (started === true) {',
            'state.soundToken = active.token;'
          ]) if (!guard.includes(required)) throw new Error(`Guard is missing ${required}`);

          for (const required of [
            'start: 0',
            'turnMovement: true',
            'if (options.turnMovement === true) clip.__rrAuthorizedTurnMove = true;',
            'const key = rotationToken || `${gameId}:${fromTurnId}:${turnId}:${epoch}`'
          ]) if (!policy.includes(required)) throw new Error(`Turn policy is missing ${required}`);
          if (!bindings.includes('this.__rrAuthorizedTurnMove !== true')) {
            throw new Error('Opening filter still blocks approved turn movement.');
          }

          const animationMs = Number(sync.match(/FALLBACK_ANIMATION_MS\s*=\s*(\d+)/)?.[1]);
          const silentProgress = Number(sync.match(/SILENT_PROGRESS\s*=\s*([\d.]+)/)?.[1]);
          const trimmedMs = (0.74 - silentProgress) * animationMs;
          if (!(animationMs === 5300 && trimmedMs >= 475 && trimmedMs <= 525)) {
            throw new Error(`Opening trim is ${trimmedMs} ms instead of about 500 ms.`);
          }
          if (!/duration\s*=\s*5300/i.test(animation)) {
            throw new Error('Protected opening visual duration is no longer 5300 ms.');
          }
          console.log(JSON.stringify({ approvedSoundBeforeRotation: true, wrapperDedupFallback: true, openingTrimMs: trimmedMs }));
          NODE
      - name: Verify protected animation hashes
        run: |
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
      - name: Verify live Netlify branch preview
        timeout-minutes: 7
        run: |
          url="https://lamp-development--famous-piroshki-b621da.netlify.app/?verify=${GITHUB_SHA}"
          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "$url" || true)"
            if printf '%s' "$html" | grep -Fq 'spin-audio-policy.js?v=4&turnsound=4&reliable=1' \
              && printf '%s' "$html" | grep -Fq 'turn-facing-guard.js?v=4&lock=5&owner=3&opening=1&sound=1' \
              && printf '%s' "$html" | grep -Fq 'opening-spin-sync.js?v=5&trim=1' \
              && printf '%s' "$html" | grep -Fq 'async function rnbAttachBotWithRetry(gameId,profile)'; then
              echo "Live Netlify preview contains the one-click bot retry and reliable audio build."
              exit 0
            fi
            echo "Waiting for Netlify branch preview deployment (attempt ${attempt}/42)..."
            sleep 10
          done
          echo "Netlify branch preview did not expose the new build in time."
          exit 1