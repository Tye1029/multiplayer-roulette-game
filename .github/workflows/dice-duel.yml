name: Lucky Dice and Dice Duel
on:
  push:
    branches: [mountain-race-development]
  pull_request:
    branches: [safe-cracker-development]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.3.14 playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/lucky-dice.test.mjs scripts/dice-duel-multiplayer.test.mjs scripts/dice-duel.test.mjs scripts/site-hub.test.mjs scripts/unified-tables.test.mjs
      - run: node scripts/lucky-dice-simulation.mjs
      - run: npm run build
      - run: node scripts/dice-v2-browser.test.mjs
      - run: node scripts/site-entry-browser.test.mjs
      - run: node scripts/home-navigation-browser.test.mjs
