name: Summit Sprint Multiplayer Diagnostic

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-multiplayer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build
        run: npm run build

      - name: Check Summit Sprint JavaScript syntax
        run: |
          node --check assets/mountain-race/mountain-race.js
          node --check assets/mountain-race/mountain-race-multiplayer.js
          node --check netlify/functions/mountain-race/state-model.js
          node --check netlify/functions/mountain-race/integration.js
          node --check scripts/patch-mountain-race-multiplayer.mjs
          node --check scripts/patch-mountain-race-mode-option.mjs
          node --check scripts/validate-mountain-race-multiplayer.mjs

      - name: Validate multiplayer and full bot race
        run: npm run validate:mountain-race

      - name: Verify generated multiplayer launcher and bot driver
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-mode="mountainrace"' index.html
          grep -Fq '>Summit Sprint</button>' index.html
          grep -Fq 'data-rnb-game="mountainrace"' index.html
          grep -Fq 'data-mountain-race-mount' index.html
          grep -Fq 'window.__mountainRaceBridge' index.html
          grep -Fq "option.value = 'mountainrace'" index.html
          grep -Fq 'mountain-race-multiplayer.js?v=1' index.html
          grep -Fq 'MOUNTAIN_RACE_SERVER_START' netlify/functions/_data.js
          grep -Fq 'mountainrace: "Summit Sprint"' netlify/functions/_data.js
          grep -Fq 'mountainRaceAction(actorUser, gameId, rawChoice, details)' netlify/functions/_data.js
          grep -Fq 'Mountain Bot' netlify/functions/_data.js
          grep -Fq 'const MOUNTAIN_RACE_BOT_CATCH_UP_LIMIT = 10;' netlify/functions/mountain-race/integration.js
          grep -Fq 'async function applyActionUnlocked' netlify/functions/mountain-race/integration.js
          grep -Fq 'processed < MOUNTAIN_RACE_BOT_CATCH_UP_LIMIT' netlify/functions/mountain-race/integration.js
          grep -Fq "ignoreReason: 'prompt-changed'" netlify/functions/mountain-race/integration.js

      - name: Verify standalone prototype remains available
        shell: bash
        run: |
          set -euo pipefail
          test -s mountain-race-preview.html
          grep -Fq 'data-mountain-race-demo' mountain-race-preview.html
          grep -Fq 'const TOTAL_HOLDS = 24;' assets/mountain-race/mountain-race.js
          grep -Fq 'const RACE_DURATION_MS = 30_000;' assets/mountain-race/mountain-race.js
          grep -Fq 'const BOT_ERROR_RATE = 0.08;' assets/mountain-race/mountain-race.js

      - name: Verify protected game files remain present
        run: |
          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify multiplayer preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'

          for attempt in $(seq 1 48); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_multiplayer=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            multiplayer_js="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?v=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            prototype_page="$(curl -fsSL --max-time 20 "${url}mountain-race-preview.html?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq 'data-mode="mountainrace"' <<<"$page" && \
               grep -Fq 'data-rnb-game="mountainrace"' <<<"$page" && \
               grep -Fq 'data-mountain-race-mount' <<<"$page" && \
               grep -Fq 'window.__mountainRaceBridge' <<<"$page" && \
               grep -Fq "option.value = 'mountainrace'" <<<"$page" && \
               grep -Fq "const STATE_EVENT = 'mountainrace:state'" <<<"$multiplayer_js" && \
               grep -Fq 'mountainrace:input:${token}' <<<"$multiplayer_js" && \
               grep -Fq 'data-mountain-race-demo' <<<"$prototype_page"; then
              echo "Verified live Summit Sprint multiplayer launcher, working bot build, and standalone prototype at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Summit Sprint multiplayer deployment (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify did not serve the current Summit Sprint multiplayer launcher and runtime.' >&2
          exit 1
