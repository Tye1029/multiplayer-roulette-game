name: Summit Sprint Multiplayer Diagnostic

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-multiplayer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build
        run: npm run build

      - name: Check Summit Sprint JavaScript syntax
        run: |
          node --check assets/mountain-race/mountain-race.js
          node --check assets/mountain-race/mountain-race-multiplayer.js
          node --check netlify/functions/mountain-race/state-model.js
          node --check netlify/functions/mountain-race/integration.js
          node --check scripts/patch-mountain-race-multiplayer.mjs
          node --check scripts/patch-mountain-race-remote-bot-attach.mjs
          node --check scripts/patch-mountain-race-start-stability.mjs
          node --check scripts/patch-mountain-race-bot-pacing-and-network-log.mjs
          node --check scripts/patch-mountain-race-gameplay-visibility.mjs
          node --check scripts/patch-mountain-race-load-performance.mjs
          node --check scripts/patch-mountain-race-mode-option.mjs
          node --check scripts/patch-mountain-race-continuous-sync-server-v6.mjs
          node --check scripts/patch-mountain-race-continuous-sync-client-v6.mjs
          node --check scripts/patch-mountain-race-continuous-sync-validator-v6.mjs
          node --check scripts/patch-mountain-race-startup-completion-v7.mjs
          node --check scripts/patch-mountain-race-startup-completion-validator-v7.mjs
          node --check scripts/validate-mountain-race-multiplayer.mjs
          node --check scripts/validate-mountain-race-remote-bot-attach.mjs
          node --check scripts/validate-mountain-race-start-stability.mjs
          node --check scripts/validate-mountain-race-gameplay-visibility.mjs
          node --check scripts/validate-mountain-race-load-performance.mjs

      - name: Validate multiplayer and paced bot race
        run: npm run validate:mountain-race

      - name: Verify generated multiplayer startup and bot path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-mode="mountainrace"' index.html
          grep -Fq '>Summit Sprint</button>' index.html
          grep -Fq 'data-rnb-game="mountainrace"' index.html
          grep -Fq 'data-mountain-race-mount' index.html
          grep -Fq 'window.__mountainRaceBridge' index.html
          grep -Fq "option.value = 'mountainrace'" index.html
          grep -Fq "duelRequest('create-remote-bot'" index.html
          grep -Fq 'MOUNTAIN_RACE_REMOTE_BOT_ATTACH_V2' index.html
          grep -Fq 'MOUNTAIN_RACE_START_STABILITY_V1' index.html
          grep -Fq 'MOUNTAIN_RACE_NETWORK_BOT_LOG_V2' index.html
          grep -Fq 'MOUNTAIN_RACE_LOAD_PERFORMANCE_V1' index.html
          grep -Fq 'MOUNTAIN_RACE_CONTINUOUS_SYNC_V6' index.html
          grep -Fq 'MOUNTAIN_RACE_STARTUP_COMPLETION_V7' index.html
          grep -Fq 'mountainRaceNetworkBotLogBootstrap' index.html
          grep -Fq "element.textContent = 'Network Bot Log'" index.html
          grep -Fq 'attempts < 8' index.html
          ! grep -Fq 'new MutationObserver(renameNetworkBotLog)' index.html
          grep -Fq "if(game.mode==='mountainrace')" index.html
          grep -Fq '["safecracker", "mountainrace"].includes' index.html
          grep -Fq 'async function duelSafeCrackerReadyRequest(gameId)' index.html
          grep -Fq "const probe = await duelRequest('get', { gameId: id, knownRevision: '' }" index.html
          grep -Fq 'function mountainRacePauseCompletedPolling(game)' index.html
          grep -Fq 'mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=7' index.html
          grep -Fq 'MOUNTAIN_RACE_LOAD_PERFORMANCE_V1' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'MOUNTAIN_RACE_CONTINUOUS_SYNC_V6' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'MOUNTAIN_RACE_STARTUP_COMPLETION_V7' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function meaningfulRenderKey(game)' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'sameMeaningfulState && runtime.root?.isConnected' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function mergeMountainRaceGame(' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq "choice: 'mountainrace:batch'" assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq "runtime.game?.status === 'complete' || publicState.completedAt" assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'MOUNTAIN_RACE_SERVER_START' netlify/functions/_data.js
          grep -Fq 'mountainrace: "Summit Sprint"' netlify/functions/_data.js
          grep -Fq 'async function duelCreateRemoteNetworkBotGame' netlify/functions/_data.js
          grep -Fq 'Remote Network Bot supports Roulette, Draw, Fishing, Safe Cracker, and Summit Sprint.' netlify/functions/_data.js
          test "$(grep -Fc 'Remote Network Bot supports Roulette, Draw, Fishing, Safe Cracker, and Summit Sprint.' netlify/functions/_data.js)" -ge 2
          grep -Fq 'mountainraceState:null' netlify/functions/_data.js
          grep -Fq 'remoteNetworkTest: Boolean(game.remoteNetworkTest)' netlify/functions/_data.js
          grep -Fq 'const effectiveStartMs = game?.mode === "mountainrace" ? atMs + 3000 : startMs;' netlify/functions/_data.js
          grep -Fq 'const mountainRaceRequest = String(gameId || "").startsWith("duel-mountainrace-");' netlify/functions/_data.js
          grep -Fq 'action === "create-remote-bot"' netlify/functions/duel-action.js
          grep -Fq 'mountainRaceAction(actorUser, gameId, rawChoice, details)' netlify/functions/_data.js
          grep -Fq 'const MOUNTAIN_RACE_BOT_CATCH_UP_LIMIT = 1;' netlify/functions/mountain-race/integration.js
          grep -Fq 'const MOUNTAIN_RACE_BOT_REACTION_MIN_MS = 520;' netlify/functions/mountain-race/integration.js
          grep -Fq 'const MOUNTAIN_RACE_BOT_REACTION_MAX_MS = 760;' netlify/functions/mountain-race/integration.js
          grep -Fq 'const MOUNTAIN_RACE_BOT_MIN_STEP_INTERVAL_MS = 800;' netlify/functions/mountain-race/integration.js
          grep -Fq 'scheduleFromMs: currentNow' netlify/functions/mountain-race/integration.js
          grep -Fq 'currentNow < lastBotActionMs + MOUNTAIN_RACE_BOT_MIN_STEP_INTERVAL_MS' netlify/functions/mountain-race/integration.js
          grep -Fq 'winnerHolds < totalHolds && !timeoutResolution' netlify/functions/mountain-race/integration.js
          grep -Fq 'networkBotLog: (() => {' netlify/functions/mountain-race/integration.js
          grep -Fq 'processed < MOUNTAIN_RACE_BOT_CATCH_UP_LIMIT' netlify/functions/mountain-race/integration.js
          grep -Fq "ignoreReason: 'prompt-changed'" netlify/functions/mountain-race/integration.js
          grep -Fq 'async function foldDueBotActions(' netlify/functions/mountain-race/integration.js
          grep -Fq 'inputPrompts: state.sequence.slice' netlify/functions/mountain-race/integration.js
          grep -Fq 'secondsLeft: complete || state.completedAt' netlify/functions/mountain-race/integration.js

      - name: Verify standalone prototype remains available
        shell: bash
        run: |
          set -euo pipefail
          test -s mountain-race-preview.html
          grep -Fq 'data-mountain-race-demo' mountain-race-preview.html
          grep -Fq 'const TOTAL_HOLDS = 24;' assets/mountain-race/mountain-race.js
          grep -Fq 'const RACE_DURATION_MS = 30_000;' assets/mountain-race/mountain-race.js
          grep -Fq 'const BOT_ERROR_RATE = 0.08;' assets/mountain-race/mountain-race.js

      - name: Verify protected game files remain present
        run: |
          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify multiplayer preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'

          for attempt in $(seq 1 48); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_startup_completion_v7=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            multiplayer_js="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=7&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            prototype_page="$(curl -fsSL --max-time 20 "${url}mountain-race-preview.html?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq 'data-mode="mountainrace"' <<<"$page" && \
               grep -Fq 'data-rnb-game="mountainrace"' <<<"$page" && \
               grep -Fq "duelRequest('create-remote-bot'" <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_REMOTE_BOT_ATTACH_V2' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_START_STABILITY_V1' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_NETWORK_BOT_LOG_V2' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_LOAD_PERFORMANCE_V1' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_CONTINUOUS_SYNC_V6' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_STARTUP_COMPLETION_V7' <<<"$page" && \
               grep -Fq 'attempts < 8' <<<"$page" && \
               ! grep -Fq 'new MutationObserver(renameNetworkBotLog)' <<<"$page" && \
               grep -Fq "if(game.mode==='mountainrace')" <<<"$page" && \
               grep -Fq 'data-mountain-race-mount' <<<"$page" && \
               grep -Fq 'window.__mountainRaceBridge' <<<"$page" && \
               grep -Fq "option.value = 'mountainrace'" <<<"$page" && \
               grep -Fq 'async function duelSafeCrackerReadyRequest(gameId)' <<<"$page" && \
               grep -Fq 'function mountainRacePauseCompletedPolling(game)' <<<"$page" && \
               grep -Fq "const STATE_EVENT = 'mountainrace:state'" <<<"$multiplayer_js" && \
               grep -Fq 'MOUNTAIN_RACE_CONTINUOUS_SYNC_V6' <<<"$multiplayer_js" && \
               grep -Fq 'MOUNTAIN_RACE_STARTUP_COMPLETION_V7' <<<"$multiplayer_js" && \
               grep -Fq 'function meaningfulRenderKey(game)' <<<"$multiplayer_js" && \
               grep -Fq 'sameMeaningfulState && runtime.root?.isConnected' <<<"$multiplayer_js" && \
               grep -Fq 'function mergeMountainRaceGame(' <<<"$multiplayer_js" && \
               grep -Fq "choice: 'mountainrace:batch'" <<<"$multiplayer_js" && \
               grep -Fq 'data-mountain-race-demo' <<<"$prototype_page"; then
              echo "Verified live Summit Sprint Startup Completion V7 at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Summit Sprint Startup Completion V7 deployment (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify did not serve the current Summit Sprint Startup Completion V7 build.' >&2
          exit 1
