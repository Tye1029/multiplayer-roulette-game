name: Summit Sprint Multiplayer Diagnostic

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-multiplayer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build
        run: npm run build

      - name: Check Summit Sprint JavaScript syntax
        run: |
          node --check assets/mountain-race/mountain-race.js
          node --check assets/mountain-race/mountain-race-multiplayer.js
          node --check netlify/functions/_data.js
          node --check netlify/functions/mountain-race/state-model.js
          node --check netlify/functions/mountain-race/integration.js
          node --check netlify/functions/duel-action.js
          node --check scripts/patch-mountain-race-load-performance.mjs
          node --check scripts/patch-mountain-race-input-rebase-v8.mjs
          node --check scripts/patch-mountain-race-fast-ack-v9.mjs
          node --check scripts/patch-mountain-race-terminal-poll-v10.mjs
          node --check scripts/patch-mountain-race-lifecycle-guard-v11.mjs
          node --check scripts/patch-mountain-race-terminal-drain-v12.mjs
          node --check scripts/patch-mountain-race-terminal-drain-rematch-v12.mjs
          node --check scripts/validate-mountain-race-input-rebase-v8.mjs
          node --check scripts/validate-mountain-race-fast-ack-v9.mjs
          node --check scripts/validate-mountain-race-terminal-poll-v10.mjs
          node --check scripts/validate-mountain-race-lifecycle-guard-v11.mjs
          node --check scripts/validate-mountain-race-terminal-drain-v12.mjs

      - name: Validate multiplayer, pacing, synchronization, rebasing, acknowledgement, terminal polling, lifecycle ordering, and scheduler drain
        run: |
          npm run validate:mountain-race
          node scripts/validate-mountain-race-input-rebase-v8.mjs
          node scripts/validate-mountain-race-fast-ack-v9.mjs
          node scripts/validate-mountain-race-terminal-poll-v10.mjs
          node scripts/validate-mountain-race-lifecycle-guard-v11.mjs
          node scripts/validate-mountain-race-terminal-drain-v12.mjs

      - name: Verify generated multiplayer path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-mode="mountainrace"' index.html
          grep -Fq '>Summit Sprint</button>' index.html
          grep -Fq 'data-rnb-game="mountainrace"' index.html
          grep -Fq 'data-mountain-race-mount' index.html
          grep -Fq 'window.__mountainRaceBridge' index.html
          grep -Fq "duelRequest('create-remote-bot'" index.html
          grep -Fq 'MOUNTAIN_RACE_REMOTE_BOT_ATTACH_V2' index.html
          grep -Fq 'MOUNTAIN_RACE_START_STABILITY_V1' index.html
          grep -Fq 'MOUNTAIN_RACE_NETWORK_BOT_LOG_V2' index.html
          grep -Fq 'MOUNTAIN_RACE_LOAD_PERFORMANCE_V1' index.html
          grep -Fq 'MOUNTAIN_RACE_CONTINUOUS_SYNC_V6' index.html
          grep -Fq 'MOUNTAIN_RACE_STARTUP_COMPLETION_V7' index.html
          grep -Fq 'MOUNTAIN_RACE_INPUT_REBASE_V8' index.html
          grep -Fq 'MOUNTAIN_RACE_FAST_ACK_V9' index.html
          grep -Fq 'MOUNTAIN_RACE_TERMINAL_POLL_V10' index.html
          grep -Fq 'MOUNTAIN_RACE_LIFECYCLE_GUARD_V11' index.html
          grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12' index.html
          grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12_POLL_START' index.html
          grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12_AFTER_ADOPT' index.html
          grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12_ADOPT' index.html
          grep -Fq 'let remembered = window.__mountainRaceLastCompletedGame || null;' index.html
          grep -Fq 'remembered = null;' index.html
          grep -Fq 'rnbGame = terminalGame;' index.html
          grep -Fq 'function mountainRacePauseCompletedPolling(game)' index.html
          grep -Fq 'mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=12' index.html

          grep -Fq 'MOUNTAIN_RACE_INPUT_REBASE_V8' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function meaningfulRenderKey(game)' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function mergeMountainRaceGame(' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function authoritativeSlip(' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function rebaseInputQueueAgainstGame(' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'data-mr-displayed-expected=' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'displayedExpected !== currentExpected' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq "choice: 'mountainrace:batch'" assets/mountain-race/mountain-race-multiplayer.js

          grep -Fq 'MOUNTAIN_RACE_SERVER_START' netlify/functions/_data.js
          grep -Fq 'MOUNTAIN_RACE_FAST_ACK_V9' netlify/functions/_data.js
          grep -Fq 'async function mountainRaceFastSaveGame(game)' netlify/functions/_data.js
          grep -Fq 'saveGame: mountainRaceFastSaveGame' netlify/functions/_data.js
          grep -Fq 'mountainrace: "Summit Sprint"' netlify/functions/_data.js
          grep -Fq 'Remote Network Bot supports Roulette, Draw, Fishing, Safe Cracker, and Summit Sprint.' netlify/functions/_data.js

          grep -Fq 'MOUNTAIN_RACE_FAST_ACK_V9' netlify/functions/duel-action.js
          grep -Fq 'result?.skipBalanceLookup' netlify/functions/duel-action.js
          grep -Fq 'DUEL_SITE_USER_CACHE' netlify/functions/duel-action.js
          grep -Fq 'inputBatch: body.inputBatch' netlify/functions/duel-action.js

          grep -Fq 'const MOUNTAIN_RACE_BOT_CATCH_UP_LIMIT = 1;' netlify/functions/mountain-race/integration.js
          grep -Fq 'const MOUNTAIN_RACE_BOT_MIN_STEP_INTERVAL_MS = 800;' netlify/functions/mountain-race/integration.js
          grep -Fq 'async function foldDueBotActions(' netlify/functions/mountain-race/integration.js
          grep -Fq 'inputPrompts: state.sequence.slice' netlify/functions/mountain-race/integration.js
          grep -Fq 'secondsLeft: complete || state.completedAt' netlify/functions/mountain-race/integration.js

      - name: Verify standalone prototype and protected games
        shell: bash
        run: |
          set -euo pipefail
          test -s mountain-race-preview.html
          grep -Fq 'data-mountain-race-demo' mountain-race-preview.html
          grep -Fq 'const TOTAL_HOLDS = 24;' assets/mountain-race/mountain-race.js
          grep -Fq 'const RACE_DURATION_MS = 30_000;' assets/mountain-race/mountain-race.js
          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify multiplayer preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'

          for attempt in $(seq 1 48); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_terminal_drain_v12=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            multiplayer_js="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=12&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            prototype_page="$(curl -fsSL --max-time 20 "${url}mountain-race-preview.html?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq 'data-mode="mountainrace"' <<<"$page" && \
               grep -Fq 'data-rnb-game="mountainrace"' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_INPUT_REBASE_V8' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_FAST_ACK_V9' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_TERMINAL_POLL_V10' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_LIFECYCLE_GUARD_V11' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12_POLL_START' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12_AFTER_ADOPT' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_TERMINAL_DRAIN_V12_ADOPT' <<<"$page" && \
               grep -Fq 'mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=12' <<<"$page" && \
               grep -Fq 'let remembered = window.__mountainRaceLastCompletedGame || null;' <<<"$page" && \
               grep -Fq 'remembered = null;' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_INPUT_REBASE_V8' <<<"$multiplayer_js" && \
               grep -Fq 'function authoritativeSlip(' <<<"$multiplayer_js" && \
               grep -Fq 'data-mountain-race-demo' <<<"$prototype_page"; then
              echo "Verified live Summit Sprint Terminal Drain V12 at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Summit Sprint Terminal Drain V12 deployment (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify did not serve the current Summit Sprint Terminal Drain V12 build.' >&2
          exit 1
