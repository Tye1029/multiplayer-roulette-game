name: Safe Cracker Texture Pass Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and regressions
        run: npm run build
      - name: Verify live material reset
        shell: bash
        run: |
          set -u
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&texture=6'
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?texture_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            steel="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/textures/safe-steel-base.svg?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            wear="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/textures/metal-wear.svg?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            dial="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/textures/dial-machined.svg?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            texture_block="$(sed -n '/SAFE_CRACKER_TEXTURE_PASS_V6_START/,/SAFE_CRACKER_TEXTURE_PASS_V6_END/p' <<<"$css")"
            if grep -Fq '&texture=6' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_TEXTURE_PASS_V6_START' <<<"$texture_block" && \
               grep -Fq '/assets/safe-cracker/textures/safe-steel-base.svg?v=3' <<<"$texture_block" && \
               grep -Fq '/assets/safe-cracker/textures/metal-wear.svg?v=3' <<<"$texture_block" && \
               grep -Fq '/assets/safe-cracker/textures/dial-machined.svg?v=3' <<<"$texture_block" && \
               grep -Fq '.safe-cracker-game .sc-dial-wrap::before' <<<"$texture_block" && \
               grep -Fq '.safe-cracker-game .sc-dial-face::after' <<<"$texture_block" && \
               grep -Fq 'content: none !important' <<<"$texture_block" && \
               ! grep -Fq 'repeating-conic-gradient' <<<"$texture_block" && \
               ! grep -Fq 'circle at ' <<<"$texture_block" && \
               ! grep -Fq 'ellipse at ' <<<"$texture_block" && \
               grep -Fq 'baseFrequency=".82 .012"' <<<"$steel" && \
               grep -Fq 'stroke-opacity=".2"' <<<"$wear" && \
               grep -Fq 'data-material="concentric-machining-v2"' <<<"$dial" && \
               ! grep -Fq '<path' <<<"$dial" && \
               grep -Fq 'SAFE_CRACKER_ACTIVE_RENDER_GUARD_V16_START' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_REFRESH_SELECTOR_V16_START' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_SAMPLE_MIX_V11_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker material reset v6: image-based steel and wear remain, directional surface light and dial-bound glare are absent, pre-lobby board retention is present, and protected gameplay remains intact at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker material reset v6 (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with Safe Cracker material reset v6 and current safeguards.' >&2
          exit 1
