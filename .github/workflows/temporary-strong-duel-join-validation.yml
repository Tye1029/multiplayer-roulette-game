name: Temporary Strong Duel Join Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run complete Netlify build and validators
        run: npm run build
      - name: Verify strong join reads and retry safety
        run: |
          grep -Fq 'async function duelGetRawStrong(gameId, attempts = 3)' netlify/functions/_data.js
          grep -Fq 'duelGetRaw(gameId, { consistency: "strong" })' netlify/functions/_data.js
          grep -Fq 'async function duelJoinGame(user, gameId)' netlify/functions/_data.js
          grep -Fq 'async function duelAddRemoteNetworkBot(user, gameId, profile = "normal")' netlify/functions/_data.js
          grep -Fq 'recoveredExistingBot:true' netlify/functions/_data.js
      - name: Verify protected animation hashes
        run: |
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
