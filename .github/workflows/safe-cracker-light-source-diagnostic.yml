name: Safe Cracker Light Source Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and regressions
        run: npm run build
      - name: Verify live localized cool light pass
        shell: bash
        run: |
          set -u
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&texture=5&shadow=1&light=5'
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?light_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            light_block="$(sed -n '/SAFE_CRACKER_LIGHT_SOURCE_V4_START/,/SAFE_CRACKER_LIGHT_SOURCE_V4_END/p' <<<"$css")"
            if grep -Fq '&texture=5&shadow=1&light=5' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_TEXTURE_PASS_V4_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_SHADOW_DEPTH_V1_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_LIGHT_SOURCE_V4_START' <<<"$light_block" && \
               grep -Fq 'radial-gradient(ellipse 58% 43% at 52% -5%' <<<"$light_block" && \
               grep -Fq 'radial-gradient(ellipse 42% 31% at 72% 70%' <<<"$light_block" && \
               grep -Fq '.safe-cracker-game .sc-safe-shell::after' <<<"$light_block" && \
               grep -Fq '.safe-cracker-game .sc-dial-wrap::after' <<<"$light_block" && \
               grep -Fq 'content: none !important' <<<"$light_block" && \
               grep -Fq 'border-color: #151c21 !important' <<<"$light_block" && \
               grep -Fq 'border-color: #171d21 !important' <<<"$light_block" && \
               ! grep -Fq 'background-image:' <<<"$light_block" && \
               ! grep -Fq 'repeating-conic-gradient' <<<"$light_block" && \
               grep -Fq '/assets/safe-cracker/textures/dial-machined.svg?v=2' <<<"$css" && \
               ! grep -Fq 'SAFE_CRACKER_LIGHT_SOURCE_V3_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_ACTIVE_RENDER_GUARD_V15_START' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_SAMPLE_MIX_V11_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker lighting cleanup: one localized cool source stays stationary, the lower recess has restrained fill, dial-local glare is disabled, active-board retention is present, and protected gameplay remains intact at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker lighting cleanup (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the Safe Cracker lighting cleanup and current safeguards.' >&2
          exit 1
