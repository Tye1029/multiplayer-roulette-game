name: Safe Cracker Light Source Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and regressions
        run: npm run build
      - name: Verify live visible low-cost scene light
        shell: bash
        run: |
          set -u
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&texture=6&shadow=1&light=7'
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?light_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            light_block="$(sed -n '/SAFE_CRACKER_LIGHT_SOURCE_V7_START/,/SAFE_CRACKER_LIGHT_SOURCE_V7_END/p' <<<"$css")"
            overlay_block="$(sed -n '/\.safe-cracker-game \.sc-safe-shell::after/,/\/\* Fixed trim/p' <<<"$light_block")"
            if grep -Fq '&texture=6&shadow=1&light=7' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_TEXTURE_PASS_V6_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_SHADOW_DEPTH_V1_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_LIGHT_SOURCE_V7_START' <<<"$light_block" && \
               grep -Fq 'contain: paint' <<<"$light_block" && \
               grep -Fq 'radial-gradient(ellipse 76% 56% at 36% -7%' <<<"$light_block" && \
               grep -Fq 'rgba(255, 255, 255, .42)' <<<"$light_block" && \
               grep -Fq 'linear-gradient(118deg' <<<"$light_block" && \
               grep -Fq 'border-top-color: rgba(242, 248, 251, .24)' <<<"$light_block" && \
               grep -Fq 'border-right-color: rgba(132, 154, 169, .11)' <<<"$light_block" && \
               grep -Fq '@media (max-width: 700px)' <<<"$light_block" && \
               grep -Fq '.safe-cracker-game .sc-dial-wrap' <<<"$light_block" && \
               grep -Fq '.safe-cracker-game .sc-dial-pointer' <<<"$light_block" && \
               grep -Fq 'filter: none !important' <<<"$light_block" && \
               ! grep -Fq 'box-shadow:' <<<"$overlay_block" && \
               ! grep -Fq 'SAFE_CRACKER_LIGHT_SOURCE_V6_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_RENDERER_RETENTION_V17_START' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_POLL_STABILITY_V17_START' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_SAMPLE_MIX_V11_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker lighting v7: the stronger two-layer stationary source is visible across the complete safe, mobile rotating filters are disabled, runtime stability v17 is present, and protected gameplay remains intact at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker lighting v7 (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with Safe Cracker lighting v7 and runtime stability v17.' >&2
          exit 1
