name: Build TerrorCounter BA2

on:
  push:
    branches:
      - chatgpt/terrorcounter-build
    paths-ignore:
      - 'chatgpt-build/TerrorCounter.ba2.b64'
      - 'chatgpt-build/TerrorCounter.ba2.sha256.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/terrorcounter-build

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Restore verified TerrorCounter source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            'https://raw.githubusercontent.com/Tye1029/multiplayer-roulette-game/89858946d43fd37f836f475818dc5b1b3cd77617/.github/workflows/terrorcounter-build.yml' \
            -o /tmp/original-terrorcounter-workflow.yml
          python3 - <<'PY'
          import base64, gzip, hashlib, re
          from pathlib import Path
          text = Path('/tmp/original-terrorcounter-workflow.yml').read_text()
          m = re.search(r"cat > /tmp/TerrorCounter\.as\.gz\.b64 <<'B64'\n(.*?)\n\s*B64", text, re.S)
          if not m:
              raise SystemExit('Embedded source payload not found')
          payload = ''.join(line.strip() for line in m.group(1).splitlines())
          source = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(source).hexdigest()
          expected = '46cc541f338f4b249da0f4363d919ee509f970c3c7829dd5c4f92b577c7ba743'
          print('source sha256:', digest)
          if digest != expected:
              raise SystemExit('Source checksum mismatch')
          Path('chatgpt-build').mkdir(exist_ok=True)
          Path('chatgpt-build/TerrorCounter.as').write_bytes(source)
          PY

      - name: Download Apache Flex 4.16.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -o /tmp/flex.tar.gz \
            https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          mkdir -p "$RUNNER_TEMP/flex"
          tar -xzf /tmp/flex.tar.gz -C "$RUNNER_TEMP/flex" --strip-components=1
          chmod +x "$RUNNER_TEMP/flex/bin/mxmlc"

      - name: Install Flash 11.1 compile stubs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nexussays/playerglobal.git "$RUNNER_TEMP/playerglobal"
          mkdir -p "$RUNNER_TEMP/flex/frameworks/libs/player/11.1"
          cp "$RUNNER_TEMP/playerglobal/11.1/playerglobal.swc" \
             "$RUNNER_TEMP/flex/frameworks/libs/player/11.1/playerglobal.swc"

      - name: Compile TerrorCounter.swf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/Interface
          export FLEX_HOME="$RUNNER_TEMP/flex"
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.1 \
            -swf-version=14 \
            -default-size=1920,1080 \
            -debug=false \
            -optimize=true \
            -static-link-runtime-shared-libraries=true \
            -output="$GITHUB_WORKSPACE/build/package/Interface/TerrorCounter.swf" \
            "$GITHUB_WORKSPACE/chatgpt-build/TerrorCounter.as"
          test -s build/package/Interface/TerrorCounter.swf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/package/Interface/TerrorCounter.swf')
          magic = p.read_bytes()[:3]
          print('SWF bytes:', p.stat().st_size, 'magic:', magic)
          if magic not in (b'FWS', b'CWS', b'ZWS'):
              raise SystemExit('Invalid SWF signature')
          PY

      - name: Build BA2 packer
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/DreamWeave-MP/dream_archivetool.git \
            --locked --root "$RUNNER_TEMP/dream-tools"
          "$RUNNER_TEMP/dream-tools/bin/dream_archivetool" --help >/dev/null

      - name: Package and verify TerrorCounter.ba2
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$RUNNER_TEMP/dream-tools/bin/dream_archivetool"
          "$TOOL" create build/TerrorCounter.ba2 build/package --format ba2 --ba2-kind gnrl
          test -s build/TerrorCounter.ba2
          "$TOOL" info build/TerrorCounter.ba2
          "$TOOL" list build/TerrorCounter.ba2 | tee /tmp/ba2-list.txt
          grep -qi 'Interface/TerrorCounter.swf' /tmp/ba2-list.txt
          "$TOOL" verify build/TerrorCounter.ba2 --read-payloads --json | tee /tmp/ba2-verify.json
          sha256sum build/TerrorCounter.ba2 | tee build/TerrorCounter.ba2.sha256.txt

      - name: Return verified BA2 to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 build/TerrorCounter.ba2 > chatgpt-build/TerrorCounter.ba2.b64
          cp build/TerrorCounter.ba2.sha256.txt chatgpt-build/TerrorCounter.ba2.sha256.txt
          git config user.name 'ChatGPT Build'
          git config user.email 'actions@users.noreply.github.com'
          git add chatgpt-build/TerrorCounter.ba2.b64 chatgpt-build/TerrorCounter.ba2.sha256.txt
          if git diff --cached --quiet; then
            echo 'Build output unchanged.'
          else
            git commit -m 'TerrorCounter verified BA2 output [skip ci]'
            git push origin HEAD:chatgpt/terrorcounter-build
          fi

      - name: Upload finished mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerrorCounter-BA2
          path: |
            build/TerrorCounter.ba2
            build/TerrorCounter.ba2.sha256.txt
          if-no-files-found: error
