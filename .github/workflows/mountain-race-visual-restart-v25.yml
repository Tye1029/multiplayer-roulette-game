name: Summit Sprint Visual Restart V25

on:
  workflow_dispatch:

concurrency:
  group: summit-sprint-visual-restart-v25-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-visual-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build exact Netlify output
        run: npm run build

      - name: Validate V25 PNG visual restart
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-mountain-race-art-assets-v25.mjs
          node --check scripts/patch-mountain-race-visual-restart-v25.mjs
          node --check scripts/validate-mountain-race-visual-restart-v25.mjs
          node scripts/validate-mountain-race-visual-restart-v25.mjs

          grep -Fq 'MOUNTAIN_RACE_VISUAL_RESTART_V25' assets/mountain-race/mountain-race.css
          grep -Fq 'MOUNTAIN_RACE_VISUAL_RESTART_V25' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'visual=25' index.html
          test -s assets/mountain-race/images/summit-sprint-sky-v25.png
          test -s assets/mountain-race/images/summit-sprint-cliff-left-v25.png
          test -s assets/mountain-race/images/summit-sprint-cliff-right-v25.png
          test -s assets/mountain-race/images/summit-sprint-start-platform-v25.png
          test -s assets/mountain-race/images/summit-sprint-summit-platform-v25.png
          test -s assets/mountain-race/images/summit-sprint-hold-1-v25.png
          test -s assets/mountain-race/images/summit-sprint-hold-6-v25.png

          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify V25 deployment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'
          for attempt in $(seq 1 60); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_visual_restart_v25=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?visual=25&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            styles="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race.css?visual=25&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            sky_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-sky-v25.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            left_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-cliff-left-v25.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            right_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-cliff-right-v25.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            start_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-start-platform-v25.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            summit_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-summit-platform-v25.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            hold_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-hold-6-v25.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq 'visual=25' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_VISUAL_RESTART_V25' <<<"$runtime" && \
               grep -Fq 'MOUNTAIN_RACE_VISUAL_RESTART_V25' <<<"$styles" && \
               grep -Fqi 'content-type: image/png' <<<"$sky_headers" && \
               grep -Fqi 'content-type: image/png' <<<"$left_headers" && \
               grep -Fqi 'content-type: image/png' <<<"$right_headers" && \
               grep -Fqi 'content-type: image/png' <<<"$start_headers" && \
               grep -Fqi 'content-type: image/png' <<<"$summit_headers" && \
               grep -Fqi 'content-type: image/png' <<<"$hold_headers"; then
              echo "Verified live Summit Sprint Visual Restart V25 at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Summit Sprint Visual Restart V25 deployment (${attempt}/60)..."
            sleep 10
          done
          echo 'Netlify did not serve the Summit Sprint V25 PNG restart.' >&2
          exit 1
