name: Build WebCast Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [ webcast-app-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore MainActivity source
        run: |
          mkdir -p app/src/main/java/com/example/webcast
          cat ci/MainActivity.java.b64.part1 ci/MainActivity.java.b64.part2 ci/MainActivity.java.b64.part3 ci/MainActivity.java.b64.part4 | base64 --decode > app/src/main/java/com/example/webcast/MainActivity.java

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WebCast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
