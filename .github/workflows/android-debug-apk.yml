name: Build WebCast Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [ webcast-app-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore MainActivity source
        run: |
          mkdir -p app/src/main/java/com/example/webcast
          cat ci/MainActivity.java.b64.part1 ci/MainActivity.java.b64.part2 ci/MainActivity.java.b64.part3 ci/MainActivity.java.b64.part4 | base64 --decode > app/src/main/java/com/example/webcast/MainActivity.java

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: WebCast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
