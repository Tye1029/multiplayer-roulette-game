name: Safe Cracker Control Trim Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  control-trim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated silver control trim
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-control-trim.mjs
          trim="$(sed -n '/SAFE_CRACKER_CONTROL_TRIM_V1_START/,/SAFE_CRACKER_CONTROL_TRIM_V1_END/p' assets/safe-cracker/safe-cracker.css)"
          grep -Fq '.sc-dial-wrap::after' <<<"$trim"
          grep -Fq '.sc-step-controls button' <<<"$trim"
          grep -Fq '.sc-display' <<<"$trim"
          grep -Fq '.sc-confirm-button' <<<"$trim"
          grep -Fq 'outline: 1px solid rgba(224, 232, 235, .96)' <<<"$trim"
          grep -Fq "font-family: Impact, Haettenschweiler, 'Arial Black', 'Segoe UI Black', sans-serif" <<<"$trim"
          grep -Fq 'font-size: 1.12rem' <<<"$trim"
          grep -Fq '&trim=1' index.html
          grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' assets/safe-cracker/safe-cracker.js

      - name: Verify live Netlify silver control trim
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "${url}?control_trim=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.css?v=8&polish=2&dial=7&layout=7&latch=9&screw=1&trim=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&dial=7&layout=7&latch=9&screw=1&trim=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            trim="$(sed -n '/SAFE_CRACKER_CONTROL_TRIM_V1_START/,/SAFE_CRACKER_CONTROL_TRIM_V1_END/p' <<<"$css")"

            if grep -Fq '&trim=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_CONTROL_TRIM_V1_START' <<<"$css" && \
               grep -Fq '.sc-dial-wrap::after' <<<"$trim" && \
               grep -Fq '.sc-step-controls button' <<<"$trim" && \
               grep -Fq '.sc-display' <<<"$trim" && \
               grep -Fq '.sc-confirm-button' <<<"$trim" && \
               grep -Fq 'outline: 1px solid rgba(224, 232, 235, .96)' <<<"$trim" && \
               grep -Fq "font-family: Impact, Haettenschweiler, 'Arial Black', 'Segoe UI Black', sans-serif" <<<"$trim" && \
               grep -Fq 'font-size: 1.12rem' <<<"$trim" && \
               grep -Fq 'SAFE_CRACKER_SCREW_REFINEMENT_V1_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_LATCH_REFINEMENT_V9_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker polished silver control trim and blockier Check Number label at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker control trim (${attempt}/42)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the silver control trim and blockier Check Number label.' >&2
          exit 1
