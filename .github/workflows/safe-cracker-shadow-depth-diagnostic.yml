name: Safe Cracker Shadow Depth Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and regressions
        run: npm run build
      - name: Verify live structural shadow pass
        shell: bash
        run: |
          set -u
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&texture=5&shadow=1'
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?shadow_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq '&texture=5&shadow=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_TEXTURE_PASS_V4_START' <<<"$css" && \
               grep -Fq '.safe-cracker-game .sc-dial-wrap::after' <<<"$css" && \
               grep -Fq 'content: none !important' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_SHADOW_DEPTH_V1_START' <<<"$css" && \
               grep -Fq 'inset 0 -28px 42px rgba(0, 0, 0, .25)' <<<"$css" && \
               grep -Fq '.safe-cracker-game .sc-display.green' <<<"$css" && \
               grep -Fq '.safe-cracker-game .sc-dial-wrap' <<<"$css" && \
               grep -Fq '.safe-cracker-game .sc-confirm-button:not(:disabled):not(:active)' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_ACTIVE_RENDER_GUARD_V15_START' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_SAMPLE_MIX_V11_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker structural shadow pass with corrected A2 texture, disabled dial glare, active-board retention, gameplay, audio and protected server boundaries at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker structural shadow pass (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the Safe Cracker structural shadow pass and current safeguards.' >&2
          exit 1
