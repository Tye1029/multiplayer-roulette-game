name: Safe Cracker Shadow Depth Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and regressions
        run: npm run build
      - name: Verify live visibly lighter safe tones
        shell: bash
        run: |
          set -u
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&texture=3&shadow=3'
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?shadow=3&shadow_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq '&texture=3&shadow=3' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_TEXTURE_PASS_V3_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_SHADOW_DEPTH_V2_START' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_SHADOW_DEPTH_V1_START' <<<"$css" && \
               grep -Fq 'Compatibility marker for validators' <<<"$css" && \
               grep -Fq 'linear-gradient(145deg, #56636a 0%, #303a3f 48%, #20292e 78%, #465158 100%)' <<<"$css" && \
               grep -Fq 'radial-gradient(ellipse at 72% 86%, rgba(0, 0, 0, .06), transparent 54%)' <<<"$css" && \
               grep -Fq 'linear-gradient(145deg, #718087 0%, #465259 30%, #283238 69%, #556168 100%)' <<<"$css" && \
               grep -Fq 'background-blend-mode: soft-light, overlay, screen, soft-light, normal' <<<"$css" && \
               grep -Fq 'inset 0 -28px 42px rgba(0, 0, 0, .17)' <<<"$css" && \
               grep -Fq 'inset 0 0 50px rgba(0, 0, 0, .44)' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_SAMPLE_MIX_V11_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker visibly lighter steel tones with fresh mobile cache, compatibility safeguards, stability, gameplay, audio and protected server boundaries at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify visibly lighter Safe Cracker steel tones (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the visibly lighter Safe Cracker steel tones and fresh mobile cache boundary.' >&2
          exit 1
