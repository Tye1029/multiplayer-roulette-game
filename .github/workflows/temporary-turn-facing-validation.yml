name: Temporary Turn Facing Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and browser runtime
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Verify Chrome
        run: test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version

      - name: Run Netlify build and all validators
        run: npm run build

      - name: Test authoritative turn-facing runtime
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/temporary-turn-facing-runtime-check.mjs
