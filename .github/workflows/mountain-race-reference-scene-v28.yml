name: Summit Sprint Reference Scene V28

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-reference-scene-v28-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-reference-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build exact Netlify output
        run: npm run build

      - name: Validate V28 generated reference scene
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-mountain-race-reference-scene-v28.mjs
          node --check scripts/validate-mountain-race-reference-scene-v28.mjs
          node scripts/validate-mountain-race-reference-scene-v28.mjs

          node scripts/validate-mountain-race-input-rebase-v8.mjs
          node scripts/validate-mountain-race-fast-ack-v9.mjs
          node scripts/validate-mountain-race-terminal-poll-v10.mjs
          node scripts/validate-mountain-race-lifecycle-guard-v11.mjs
          node scripts/validate-mountain-race-state-sync.mjs
          node scripts/validate-mountain-race-start-stability.mjs
          node scripts/validate-mountain-race-gameplay-visibility.mjs
          node scripts/validate-mountain-race-load-performance.mjs

          grep -Fq 'MOUNTAIN_RACE_REFERENCE_SCENE_V28' assets/mountain-race/mountain-race.css
          grep -Fq 'MOUNTAIN_RACE_REFERENCE_SCENE_V28' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'visual=28' index.html
          grep -Fq 'visual=28' mountain-race-preview.html
          test -s assets/mountain-race/images/summit-sprint-reference-scene-v28.png

          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify V28 deployment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'
          for attempt in $(seq 1 72); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_reference_v28=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?visual=28&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            styles="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race.css?visual=28&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            scene_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-reference-scene-v28.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq 'visual=28' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_REFERENCE_SCENE_V28' <<<"$runtime" && \
               grep -Fq 'MOUNTAIN_RACE_REFERENCE_SCENE_V28' <<<"$styles" && \
               grep -Fqi 'content-type: image/png' <<<"$scene_headers"; then
              echo "Verified live Summit Sprint Reference Scene V28 at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Summit Sprint V28 (${attempt}/72)..."
            sleep 10
          done
          echo 'Netlify did not serve the Summit Sprint V28 generated reference scene.' >&2
          exit 1
