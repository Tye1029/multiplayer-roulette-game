name: Safe Cracker PNG Shell Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and all regressions
        run: npm run build
      - name: Verify live supplied PNG shell
        shell: bash
        run: |
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1&stability=1&reference=1&depth=1&pngshell=1'
          css_path='assets/safe-cracker/safe-cracker.css?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1&stability=1&reference=1&depth=1&pngshell=1'
          body_path='assets/safe-cracker/reference/safe-body-layer.png?v=1'
          dial_path='assets/safe-cracker/reference/safe-dial-face-layer.png?v=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?png_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}${css_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            rm -f /tmp/sc-body.png /tmp/sc-dial.png
            curl -fsSL --max-time 20 "${url}${body_path}&commit=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/sc-body.png 2>/dev/null || true
            curl -fsSL --max-time 20 "${url}${dial_path}&commit=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/sc-dial.png 2>/dev/null || true
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            body_size="$(wc -c < /tmp/sc-body.png 2>/dev/null || echo 0)"
            dial_size="$(wc -c < /tmp/sc-dial.png 2>/dev/null || echo 0)"
            body_sig="$(od -An -tx1 -N4 /tmp/sc-body.png 2>/dev/null | tr -d ' \n')"
            dial_sig="$(od -An -tx1 -N4 /tmp/sc-dial.png 2>/dev/null | tr -d ' \n')"
            if grep -Fq '&reference=1&depth=1&pngshell=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_RUNTIME_STABILITY_V12_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_PNG_SHELL_V15_START' <<<"$css" && \
               grep -Fq "safe-body-layer.png?v=1" <<<"$css" && \
               grep -Fq "safe-dial-face-layer.png?v=1" <<<"$css" && \
               grep -Fq 'aspect-ratio: 864 / 1122' <<<"$css" && \
               grep -Fq 'left: 31.25%' <<<"$css" && \
               [ "$body_size" -gt 100000 ] && \
               [ "$dial_size" -gt 30000 ] && \
               [ "$body_sig" = '89504e47' ] && \
               [ "$dial_sig" = '89504e47' ] && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live supplied Safe Cracker PNG shell and protected regressions at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify supplied PNG shell preview (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the supplied Safe Cracker PNG shell and current safeguards.' >&2
          exit 1
