name: Temporary Bot Lifecycle Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run complete Netlify build and validators
        run: npm run build
      - name: Verify lifecycle-aware Roulette snapshot ordering
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('    function rouletteSnapshotStamp(game){');
          const end = html.indexOf('    function roulettePlayerAvatar', start);
          assert(start >= 0 && end > start, 'Could not isolate generated Roulette snapshot functions.');
          const functions = html.slice(start, end);
          const context = {
            DUEL_STATUS_RANK: { waiting: 0, ready: 1, countdown: 2, playing: 3, complete: 4, cancelled: 5 },
            rouletteAcceptedSnapshotByGame: new Map(),
            rouletteAcceptedRevisionByGame: new Map()
          };
          vm.createContext(context);
          vm.runInContext(`function rouletteRevision(game){return Number(game?.rouletteState?.revision??-1)}\n${functions}\nglobalThis.accept=rouletteAcceptSnapshot;`, context);
          const game = (status, revision, stateRevision, time) => ({
            gameId: 'duel-roulette-lifecycle-test',
            mode: 'roulette',
            status,
            revision,
            rouletteState: { revision: stateRevision },
            updatedAt: new Date(time).toISOString()
          });
          assert.strictEqual(context.accept(game('waiting', 1, 0, 2000)), true);
          assert.strictEqual(context.accept(game('ready', 1, 0, 1000)), true, 'waiting -> ready must win even with unchanged revisions and an older timestamp');
          assert.strictEqual(context.accept(game('waiting', 9, 9, 9000)), false, 'a waiting snapshot must never replace ready');
          assert.strictEqual(context.accept(game('countdown', 1, 0, 900)), true);
          assert.strictEqual(context.accept(game('playing', 5, 3, 5000)), true);
          assert.strictEqual(context.accept(game('playing', 4, 99, 6000)), false, 'same-state lower game revision must remain rejected');
          assert.strictEqual(context.accept(game('complete', 5, 3, 4000)), true, 'playing -> complete must remain authoritative');
          console.log('Lifecycle snapshot runtime checks passed.');
          NODE
      - name: Verify immediate bot paths use the shared acceptance function
        run: |
          grep -Fq 'if (game?.mode === "roulette" && !rouletteAcceptSnapshot(game)) return;' index.html
          grep -Fq 'if (got.game.mode === "roulette" && !rouletteAcceptSnapshot(got.game))' index.html
          grep -Fq "if(typeof rouletteAcceptSnapshot==='function'&&!rouletteAcceptSnapshot(game))return current||game;" index.html
      - name: Verify protected animation hashes
        run: |
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
