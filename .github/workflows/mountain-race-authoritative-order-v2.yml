name: Summit Sprint Instant Inputs V5

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-instant-inputs-v5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-instant-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build exact Netlify output
        run: npm run build

      - name: Verify immediate queued controls and authoritative batch saves
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-mountain-race-instant-input-queue-v5.mjs
          node --check scripts/patch-mountain-race-instant-input-server-v5.mjs
          node --check scripts/patch-mountain-race-instant-input-client-v5.mjs
          node --check scripts/patch-mountain-race-instant-input-validator-v5.mjs
          node --check assets/mountain-race/mountain-race-multiplayer.js
          node --check netlify/functions/mountain-race/integration.js
          node --check netlify/functions/duel-action.js
          node scripts/validate-mountain-race-state-sync.mjs

          grep -Fq 'MOUNTAIN_RACE_RELIABLE_INPUTS_V3' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'MOUNTAIN_RACE_LOW_LATENCY_INPUTS_V4' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'MOUNTAIN_RACE_INSTANT_INPUT_QUEUE_V5' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'inputQueue: []' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'async function flushInputQueue()' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq "choice: 'mountainrace:batch'" assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'prompts.length > 0 && !presentation.blocked && !runtime.inputQueueBlocked' assets/mountain-race/mountain-race-multiplayer.js

          grep -Fq 'MOUNTAIN_RACE_INSTANT_INPUT_QUEUE_V5' netlify/functions/mountain-race/integration.js
          grep -Fq 'async function applyBatchUnlocked(' netlify/functions/mountain-race/integration.js
          grep -Fq 'await saveGame(workingGame)' netlify/functions/mountain-race/integration.js
          grep -Fq 'confirmedActionIds' netlify/functions/mountain-race/integration.js
          grep -Fq 'const MOUNTAIN_RACE_ACTION_CONFIRM_ATTEMPTS = 5;' netlify/functions/mountain-race/integration.js
          grep -Fq 'inputBatch: body.inputBatch' netlify/functions/duel-action.js

          grep -Fq 'MOUNTAIN_RACE_INSTANT_INPUT_QUEUE_V5' index.html
          grep -Fq 'mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=5' index.html

          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify instant-input deployment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'
          for attempt in $(seq 1 48); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_instant_v5=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=5&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq 'MOUNTAIN_RACE_INSTANT_INPUT_QUEUE_V5' <<<"$page" && \
               grep -Fq 'mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=5' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_INSTANT_INPUT_QUEUE_V5' <<<"$runtime" && \
               grep -Fq 'async function flushInputQueue()' <<<"$runtime" && \
               grep -Fq "choice: 'mountainrace:batch'" <<<"$runtime"; then
              echo 'Verified live Summit Sprint Instant Inputs V5 deployment.'
              exit 0
            fi
            echo "Waiting for Netlify Instant Inputs V5 deployment (${attempt}/48)..."
            sleep 10
          done
          echo 'Netlify did not serve Summit Sprint Instant Inputs V5.' >&2
          exit 1
