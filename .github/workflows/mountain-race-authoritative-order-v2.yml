name: Summit Sprint Terminal Poll V10

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-terminal-poll-v10-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-terminal-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build exact Netlify output
        run: npm run build

      - name: Verify fast acknowledgement, rebasing, and terminal polling
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-mountain-race-input-rebase-v8.mjs
          node --check scripts/patch-mountain-race-fast-ack-v9.mjs
          node --check scripts/patch-mountain-race-terminal-poll-v10.mjs
          node --check scripts/validate-mountain-race-fast-ack-v9.mjs
          node --check scripts/validate-mountain-race-terminal-poll-v10.mjs
          node --check assets/mountain-race/mountain-race-multiplayer.js
          node --check netlify/functions/_data.js
          node --check netlify/functions/mountain-race/integration.js
          node --check netlify/functions/duel-action.js
          node scripts/validate-mountain-race-input-rebase-v8.mjs
          node scripts/validate-mountain-race-fast-ack-v9.mjs
          node scripts/validate-mountain-race-terminal-poll-v10.mjs
          node scripts/validate-mountain-race-state-sync.mjs
          node scripts/validate-mountain-race-start-stability.mjs
          node scripts/validate-mountain-race-gameplay-visibility.mjs
          node scripts/validate-mountain-race-load-performance.mjs

          grep -Fq 'MOUNTAIN_RACE_INPUT_REBASE_V8' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function authoritativeSlip(' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'function rebaseInputQueueAgainstGame(' assets/mountain-race/mountain-race-multiplayer.js

          grep -Fq 'MOUNTAIN_RACE_FAST_ACK_V9' netlify/functions/_data.js
          grep -Fq 'async function mountainRaceFastSaveGame(game)' netlify/functions/_data.js
          grep -Fq 'saveGame: mountainRaceFastSaveGame' netlify/functions/_data.js
          grep -Fq 'result?.skipBalanceLookup' netlify/functions/duel-action.js
          grep -Fq 'DUEL_SITE_USER_CACHE' netlify/functions/duel-action.js

          grep -Fq 'MOUNTAIN_RACE_TERMINAL_POLL_V10' index.html
          grep -Fq "window.__mountainRacePauseCompletedPolling(activeGame))return;" index.html
          grep -Fq 'window.__mountainRacePauseCompletedPolling(duelLastActiveGame || null)) return;' index.html
          grep -Fq 'function mountainRacePauseCompletedPolling(game)' index.html
          grep -Fq '!game?.remoteNetworkTest' index.html
          grep -Fq 'mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=10' index.html

          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify Terminal Poll V10 deployment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'
          for attempt in $(seq 1 48); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_terminal_poll_v10=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=10&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq 'MOUNTAIN_RACE_TERMINAL_POLL_V10' <<<"$page" && \
               grep -Fq 'mountain-race-multiplayer.js?v=1&gameplay=3&load=2&sync=10' <<<"$page" && \
               grep -Fq "window.__mountainRacePauseCompletedPolling(activeGame))return;" <<<"$page" && \
               grep -Fq 'window.__mountainRacePauseCompletedPolling(duelLastActiveGame || null)) return;' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_INPUT_REBASE_V8' <<<"$runtime" && \
               grep -Fq 'function authoritativeSlip(' <<<"$runtime"; then
              echo 'Verified live Summit Sprint Terminal Poll V10 deployment.'
              exit 0
            fi
            echo "Waiting for Netlify Terminal Poll V10 deployment (${attempt}/48)..."
            sleep 10
          done
          echo 'Netlify did not serve Summit Sprint Terminal Poll V10.' >&2
          exit 1
