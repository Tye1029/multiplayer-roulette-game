name: Safe Cracker Render Stability Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  render-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated in-place Safe Cracker updates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-render-stability.mjs
          grep -Fq 'SAFE_CRACKER_RENDER_STABILITY_V1_START' assets/safe-cracker/safe-cracker.js
          grep -Fq 'function safeCrackerUpdateMountedBoard(game)' assets/safe-cracker/safe-cracker.js
          grep -Fq 'const reusedMountedBoard = safeCrackerUpdateMountedBoard(game);' assets/safe-cracker/safe-cracker.js
          grep -Fq "mountedGameId !== gameId || status !== 'playing' || mountedStatus !== 'playing'" assets/safe-cracker/safe-cracker.js
          grep -Fq '&render=1' index.html
          grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' assets/safe-cracker/safe-cracker.js

      - name: Verify live Netlify in-place Safe Cracker updates
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "${url}?render_stability=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?render=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq '&render=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_RENDER_STABILITY_V1_START' <<<"$js" && \
               grep -Fq 'function safeCrackerUpdateMountedBoard(game)' <<<"$js" && \
               grep -Fq 'const reusedMountedBoard = safeCrackerUpdateMountedBoard(game);' <<<"$js" && \
               grep -Fq "mountedGameId !== gameId || status !== 'playing' || mountedStatus !== 'playing'" <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker in-place board updates at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker render stability (${attempt}/42)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the Safe Cracker in-place render stability patch.' >&2
          exit 1
