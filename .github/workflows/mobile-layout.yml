name: Phone layouts
on:
  push:
    branches: [mountain-race-development]
  pull_request:
    branches: [safe-cracker-development]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm install --no-save --no-package-lock @electric-sql/pglite@0.3.14 playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --test scripts/site-refinement.test.mjs scripts/public-polish.test.mjs
      - run: node scripts/site-refinement-browser.test.mjs
      - run: node scripts/game-discovery-browser.test.mjs
      - run: node scripts/home-navigation-browser.test.mjs
      - run: node scripts/mobile-layout-browser.test.mjs
        env:
          MOBILE_SCREENSHOTS: mobile-layout-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phone-layout-screens
          path: mobile-layout-results
          retention-days: 7
