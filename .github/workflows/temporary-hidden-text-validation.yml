name: Temporary Hidden Text Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run Netlify build and validators
        run: npm run build
      - name: Confirm hidden-player text is absent
        run: |
          if grep -Eqi 'player[[:space:]]+hidden[[:space:]]+until[[:space:]]+(the[[:space:]]+)?revolver[[:space:]]+chooses' index.html; then
            echo 'Hidden-player message still exists.'
            exit 1
          fi
          echo 'Hidden-player message removed.'
