name: Safe Cracker Latch Sequence Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  latch-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated latch sequence
        shell: bash
        run: |
          set -euo pipefail
          block="$(sed -n '/SAFE_CRACKER_LATCH_SEQUENCE_V1_START/,/SAFE_CRACKER_LATCH_SEQUENCE_V1_END/p' assets/safe-cracker/safe-cracker.css)"
          grep -Fq 'background-color: #aab4b8 !important' <<<"$block"
          grep -Fq '0 5px 10px rgba(0,0,0,.48) !important' <<<"$block"
          grep -Fq 'transform: translateY(4px) !important' <<<"$block"
          ! grep -Fq '#c98b29' <<<"$block"
          ! grep -Fq '#855515' <<<"$block"
          ! grep -Fq '0 7px 0' <<<"$block"
          grep -Fq '.sc-bolts.right i.sc-latch-released' <<<"$block"
          grep -Fq 'transform .58s cubic-bezier(.2,.85,.28,1)' <<<"$block"
          grep -Fq 'filter .4s ease' <<<"$block"
          grep -Fq 'opacity .4s ease' <<<"$block"
          grep -Fq 'animation: scSafeCrackerLatchReleaseV1 .82s' <<<"$block"
          ! grep -Fq 'animation: scSafeCrackerLatchReleaseV1 .58s' <<<"$block"
          grep -Fq 'right: -4px' <<<"$block"
          grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_RUNTIME' assets/safe-cracker/safe-cracker.js
          grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_HELPER' assets/safe-cracker/safe-cracker.js
          grep -Fq 'function safeCrackerLatchBank(game, me)' assets/safe-cracker/safe-cracker.js
          grep -Fq 'data-sc-latch-stage=' assets/safe-cracker/safe-cracker.js
          grep -Fq 'latchClass(1)' assets/safe-cracker/safe-cracker.js
          grep -Fq 'latchClass(2)' assets/safe-cracker/safe-cracker.js
          grep -Fq 'latchClass(3)' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerLatchBank(game, me)' assets/safe-cracker/safe-cracker.js
          ! grep -Fiq 'RESETTING' assets/safe-cracker/safe-cracker.js
          grep -Fq '&layout=7&latch=2' index.html

      - name: Verify live Netlify latch sequence
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "${url}?latch_sequence=2&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.css?v=8&polish=2&dial=7&layout=7&latch=2&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&dial=7&layout=7&latch=2&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            block="$(sed -n '/SAFE_CRACKER_LATCH_SEQUENCE_V1_START/,/SAFE_CRACKER_LATCH_SEQUENCE_V1_END/p' <<<"$css")"

            if grep -Fq '&layout=7&latch=2' <<<"$html" && \
               grep -Fq 'background-color: #aab4b8 !important' <<<"$block" && \
               grep -Fq '0 5px 10px rgba(0,0,0,.48) !important' <<<"$block" && \
               grep -Fq 'transform: translateY(4px) !important' <<<"$block" && \
               ! grep -Fq '#c98b29' <<<"$block" && \
               ! grep -Fq '#855515' <<<"$block" && \
               ! grep -Fq '0 7px 0' <<<"$block" && \
               grep -Fq '.sc-bolts.right i.sc-latch-released' <<<"$block" && \
               grep -Fq 'transform .58s cubic-bezier(.2,.85,.28,1)' <<<"$block" && \
               grep -Fq 'animation: scSafeCrackerLatchReleaseV1 .82s' <<<"$block" && \
               ! grep -Fq 'animation: scSafeCrackerLatchReleaseV1 .58s' <<<"$block" && \
               grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_RUNTIME' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_HELPER' <<<"$js" && \
               grep -Fq 'function safeCrackerLatchBank(game, me)' <<<"$js" && \
               grep -Fq 'data-sc-latch-stage=' <<<"$js" && \
               grep -Fq 'latchClass(1)' <<<"$js" && \
               grep -Fq 'latchClass(2)' <<<"$js" && \
               grep -Fq 'latchClass(3)' <<<"$js" && \
               grep -Fq 'safeCrackerLatchBank(game, me)' <<<"$js" && \
               ! grep -Fiq 'RESETTING' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker slower staged latch release at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker slower latch sequence (${attempt}/42)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the slower staged Safe Cracker latch release and current safeguards.' >&2
          exit 1
