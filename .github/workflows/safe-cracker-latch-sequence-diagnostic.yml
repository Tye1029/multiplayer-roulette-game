name: Safe Cracker Latch Sequence Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  latch-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated mounted latch assemblies
        shell: bash
        run: |
          set -euo pipefail
          block="$(sed -n '/SAFE_CRACKER_LATCH_SEQUENCE_V1_START/,/SAFE_CRACKER_LATCH_SEQUENCE_V1_END/p' assets/safe-cracker/safe-cracker.css)"
          grep -Fq 'background-color: #aab4b8 !important' <<<"$block"
          grep -Fq 'background-clip: padding-box !important' <<<"$block"
          grep -Fq 'border: 3px solid #050708 !important' <<<"$block"
          grep -Fq 'filter: none !important' <<<"$block"
          grep -Fq '.sc-confirm-button::after' <<<"$block"
          grep -Fq 'bottom: -7px' <<<"$block"
          grep -Fq 'height: 7px' <<<"$block"
          grep -Fq 'background: #050708 !important' <<<"$block"
          grep -Fq '.sc-confirm-button:active::after' <<<"$block"
          grep -Fq 'bottom: -3px' <<<"$block"
          grep -Fq 'height: 3px' <<<"$block"
          grep -Fq 'transform: translateY(4px) !important' <<<"$block"
          ! grep -Fq '#c98b29' <<<"$block"
          ! grep -Fq '#855515' <<<"$block"
          ! grep -Fq '#4d3010' <<<"$block"
          ! grep -Fq '0 7px 0' <<<"$block"
          grep -Fq 'Six fixed mounting assemblies' <<<"$block"
          grep -Fq '.sc-latch-mount::before' <<<"$block"
          grep -Fq 'width: 45px' <<<"$block"
          grep -Fq '.sc-latch-mount::after' <<<"$block"
          grep -Fq 'Inward-facing mounting ear with one recessed screw' <<<"$block"
          grep -Fq 'radial-gradient(circle at 50% 10px' <<<"$block"
          grep -Fq '#9ba6ab 1.5px 3px' <<<"$block"
          grep -Fq '#080b0d 5.5px 6.5px' <<<"$block"
          grep -Fq '.sc-bolts.left .sc-latch-mount::after' <<<"$block"
          grep -Fq '.sc-bolts.right .sc-latch-mount::after' <<<"$block"
          grep -Fq '.sc-latch-mount > i' <<<"$block"
          grep -Fq '#c2cbce 46%' <<<"$block"
          grep -Fq '.sc-bolts.right i.sc-latch-released' <<<"$block"
          grep -Fq 'transform .82s cubic-bezier(.2,.85,.28,1)' <<<"$block"
          grep -Fq 'filter .58s ease' <<<"$block"
          grep -Fq 'opacity .58s ease' <<<"$block"
          grep -Fq 'animation: scSafeCrackerLatchReleaseV1 1.15s' <<<"$block"
          ! grep -Fq 'animation: scSafeCrackerLatchReleaseV1 .82s' <<<"$block"
          grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_RUNTIME' assets/safe-cracker/safe-cracker.js
          grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_HELPER' assets/safe-cracker/safe-cracker.js
          grep -Fq 'function safeCrackerLatchMount' assets/safe-cracker/safe-cracker.js
          grep -Fq 'function safeCrackerStaticLatchBank' assets/safe-cracker/safe-cracker.js
          grep -Fq 'function safeCrackerLatchBank(game, me)' assets/safe-cracker/safe-cracker.js
          test "$(grep -Fo 'data-sc-mounted-latches=' assets/safe-cracker/safe-cracker.js | wc -l | tr -d ' ')" = '2'
          grep -Fq 'safeCrackerStaticLatchBank('\''left'\'')' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerLatchMount(latchClass(1))' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerLatchMount(latchClass(2))' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerLatchMount(latchClass(3))' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerLatchBank(game, me)' assets/safe-cracker/safe-cracker.js
          ! grep -Fiq 'RESETTING' assets/safe-cracker/safe-cracker.js
          grep -Fq '&layout=7&latch=4' index.html

      - name: Verify live Netlify mounted latch assemblies
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "${url}?latch_sequence=4&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.css?v=8&polish=2&dial=7&layout=7&latch=4&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&dial=7&layout=7&latch=4&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            block="$(sed -n '/SAFE_CRACKER_LATCH_SEQUENCE_V1_START/,/SAFE_CRACKER_LATCH_SEQUENCE_V1_END/p' <<<"$css")"

            if grep -Fq '&layout=7&latch=4' <<<"$html" && \
               grep -Fq 'background-color: #aab4b8 !important' <<<"$block" && \
               grep -Fq 'background-clip: padding-box !important' <<<"$block" && \
               grep -Fq 'border: 3px solid #050708 !important' <<<"$block" && \
               grep -Fq '.sc-confirm-button::after' <<<"$block" && \
               grep -Fq 'bottom: -7px' <<<"$block" && \
               grep -Fq 'height: 7px' <<<"$block" && \
               grep -Fq 'background: #050708 !important' <<<"$block" && \
               ! grep -Fq '#c98b29' <<<"$block" && \
               ! grep -Fq '#855515' <<<"$block" && \
               ! grep -Fq '#4d3010' <<<"$block" && \
               ! grep -Fq '0 7px 0' <<<"$block" && \
               grep -Fq 'Six fixed mounting assemblies' <<<"$block" && \
               grep -Fq '.sc-latch-mount::before' <<<"$block" && \
               grep -Fq '.sc-latch-mount::after' <<<"$block" && \
               grep -Fq 'radial-gradient(circle at 50% 10px' <<<"$block" && \
               grep -Fq '#9ba6ab 1.5px 3px' <<<"$block" && \
               grep -Fq '.sc-bolts.left .sc-latch-mount::after' <<<"$block" && \
               grep -Fq '.sc-bolts.right .sc-latch-mount::after' <<<"$block" && \
               grep -Fq '.sc-latch-mount > i' <<<"$block" && \
               grep -Fq '.sc-bolts.right i.sc-latch-released' <<<"$block" && \
               grep -Fq 'transform .82s cubic-bezier(.2,.85,.28,1)' <<<"$block" && \
               grep -Fq 'animation: scSafeCrackerLatchReleaseV1 1.15s' <<<"$block" && \
               ! grep -Fq 'animation: scSafeCrackerLatchReleaseV1 .82s' <<<"$block" && \
               grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_RUNTIME' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_LATCH_SEQUENCE_V1_HELPER' <<<"$js" && \
               grep -Fq 'function safeCrackerLatchMount' <<<"$js" && \
               grep -Fq 'function safeCrackerStaticLatchBank' <<<"$js" && \
               grep -Fq 'function safeCrackerLatchBank(game, me)' <<<"$js" && \
               [[ "$(grep -Fo 'data-sc-mounted-latches=' <<<"$js" | wc -l | tr -d ' ')" == '2' ]] && \
               grep -Fq 'safeCrackerStaticLatchBank('\''left'\'')' <<<"$js" && \
               grep -Fq 'safeCrackerLatchMount(latchClass(1))' <<<"$js" && \
               grep -Fq 'safeCrackerLatchMount(latchClass(2))' <<<"$js" && \
               grep -Fq 'safeCrackerLatchMount(latchClass(3))' <<<"$js" && \
               grep -Fq 'safeCrackerLatchBank(game, me)' <<<"$js" && \
               ! grep -Fiq 'RESETTING' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker six-latch mounting brackets, side flanges, recessed screws, and existing 1.15-second release at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker mounted latch assemblies v4 (${attempt}/42)..."
            sleep 10
          done

          echo 'Netlify preview did not serve all six mounted latch assemblies with side screws and the protected release sequence.' >&2
          exit 1
