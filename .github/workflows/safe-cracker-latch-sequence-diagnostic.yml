name: Safe Cracker Latch Sequence Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  latch-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated refined latch assemblies
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-latch-sequence.mjs
          node scripts/validate-safe-cracker-latch-refinement.mjs
          base="$(sed -n '/SAFE_CRACKER_LATCH_SEQUENCE_V1_START/,/SAFE_CRACKER_LATCH_SEQUENCE_V1_END/p' assets/safe-cracker/safe-cracker.css)"
          refine="$(sed -n '/SAFE_CRACKER_LATCH_REFINEMENT_V5_START/,/SAFE_CRACKER_LATCH_REFINEMENT_V5_END/p' assets/safe-cracker/safe-cracker.css)"
          grep -Fq 'background-color: #aab4b8 !important' <<<"$base"
          grep -Fq 'animation: scSafeCrackerLatchReleaseV1 1.15s' <<<"$base"
          grep -Fq 'top: calc(18% + 24px)' <<<"$refine"
          grep -Fq 'top: calc(18% + 30px)' <<<"$refine"
          grep -Fq 'scale(.78)' <<<"$refine"
          grep -Fq 'scale(.72)' <<<"$refine"
          grep -Fq '.sc-latch-spine' <<<"$refine"
          grep -Fq 'top: -5px' <<<"$refine"
          grep -Fq 'bottom: -5px' <<<"$refine"
          grep -Fq '.sc-latch-screw::before' <<<"$refine"
          grep -Fq '.sc-latch-screw::after' <<<"$refine"
          grep -Fq 'width: 8px; height: 2px' <<<"$refine"
          grep -Fq 'width: 2px; height: 8px' <<<"$refine"
          grep -Fq 'repeating-linear-gradient(0deg' <<<"$refine"
          grep -Fq 'class="sc-latch-spine" aria-hidden="true"' assets/safe-cracker/safe-cracker.js
          grep -Fq 'class="sc-latch-screw" aria-hidden="true"' assets/safe-cracker/safe-cracker.js
          test "$(grep -Fo 'data-sc-mounted-latches=' assets/safe-cracker/safe-cracker.js | wc -l | tr -d ' ')" = '2'
          grep -Fq '&layout=7&latch=5' index.html
          grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' assets/safe-cracker/safe-cracker.js

      - name: Verify live Netlify refined latch assemblies
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "${url}?latch_sequence=5&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.css?v=8&polish=2&dial=7&layout=7&latch=5&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&dial=7&layout=7&latch=5&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            refine="$(sed -n '/SAFE_CRACKER_LATCH_REFINEMENT_V5_START/,/SAFE_CRACKER_LATCH_REFINEMENT_V5_END/p' <<<"$css")"

            if grep -Fq '&layout=7&latch=5' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_LATCH_REFINEMENT_V5_START' <<<"$css" && \
               grep -Fq 'top: calc(18% + 30px)' <<<"$refine" && \
               grep -Fq 'transform: translateY(-50%) scale(.72)' <<<"$refine" && \
               grep -Fq '.sc-latch-spine' <<<"$refine" && \
               grep -Fq '.sc-latch-screw::before' <<<"$refine" && \
               grep -Fq '.sc-latch-screw::after' <<<"$refine" && \
               grep -Fq 'repeating-linear-gradient(0deg' <<<"$refine" && \
               grep -Fq 'class="sc-latch-spine" aria-hidden="true"' <<<"$js" && \
               grep -Fq 'class="sc-latch-screw" aria-hidden="true"' <<<"$js" && \
               [[ "$(grep -Fo 'data-sc-mounted-latches=' <<<"$js" | wc -l | tr -d ' ')" == '2' ]] && \
               grep -Fq 'animation: scSafeCrackerLatchReleaseV1 1.15s' <<<"$css" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fq 'choice: `safecracker:guess:${runtime.selected}`' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker latch v5 placement, smaller middle hardware, protruding brushed spines, Phillips screws, and protected release sequence at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker latch refinement v5 (${attempt}/42)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the refined six-latch placement, brushed mounting spines, Phillips screws, and protected release sequence.' >&2
          exit 1
