name: Temporary Live Asset Restore Check

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for restored Netlify branch preview
        shell: bash
        run: |
          set -euo pipefail
          base='https://lamp-development--famous-piroshki-b621da.netlify.app'
          for attempt in $(seq 1 30); do
            gun_code=$(curl -L -sS -o /tmp/gun.png -w '%{http_code}' "$base/assets/roulette/revolver-steel-walnut.png?restore=357f84c" || true)
            hammer_code=$(curl -L -sS -o /tmp/hammer.png -w '%{http_code}' "$base/assets/roulette/revolver-steel-walnut-hammer.png?restore=357f84c" || true)
            if [ "$gun_code" = '200' ] && [ "$hammer_code" = '200' ] && [ -s /tmp/gun.png ] && [ -s /tmp/hammer.png ]; then
              file /tmp/gun.png /tmp/hammer.png
              sha256sum /tmp/gun.png /tmp/hammer.png
              echo 'Restored live revolver assets are available.'
              exit 0
            fi
            echo "Attempt $attempt: gun=$gun_code hammer=$hammer_code; waiting for Netlify..."
            sleep 5
          done
          echo 'Restored assets were not available before timeout.' >&2
          exit 1
