name: Temporary Turn Sync Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and browser runtime
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Verify Chrome
        run: test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version
      - name: Run complete Netlify build and validators
        run: npm run build
      - name: Test authoritative facing and rotation audio runtime
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/temporary-turn-sync-runtime-check.mjs
      - name: Verify protected animation hashes
        run: |
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
