name: Safe Cracker Sample Mix Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run exact Netlify build and regression suites
        run: npm run build
      - name: Verify live Netlify sample mix
        shell: bash
        run: |
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          js_path='assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1'
          for attempt in $(seq 1 36); do
            html="$(curl -fsSL --max-time 20 "${url}?sample_commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}${js_path}&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            sample="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/audio-data/safe-door-open.b64?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq '/assets/safe-cracker/safe-cracker.js?v=8&polish=2&fit=2&result=1&final=1&refine=1&correct=1&input=1&audio=1&samples=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_SAMPLE_MIX_V11_START' <<<"$js" && \
               grep -Fq 'const SAFE_CRACKER_SAMPLE_MANIFEST = Object.freeze({' <<<"$js" && \
               grep -Fq "safeCrackerPlaySample('submitLatch'" <<<"$js" && \
               grep -Fq "safeCrackerPlaySample('tumblerLock'" <<<"$js" && \
               grep -Fq "safeCrackerPlaySample('safeUnlock'" <<<"$js" && \
               grep -Fq "safeCrackerPlaySample('boltMechanism'" <<<"$js" && \
               grep -Fq "safeCrackerPlaySample('safeDoorOpen'" <<<"$js" && \
               grep -Fq "safeCrackerPlaySample('safeDoorLockdown'" <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_AUDIO_PASS_V10_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_INPUT_CONTINUITY_V9_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_VIDEO_CORRECTION_V8_START' <<<"$js" && \
               [ "${#sample}" -gt 4000 ] && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker sample mix v11, full Safe Cracker regression, and protected Roulette regression at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Safe Cracker sample-mix-v11 preview (${attempt}/36)..."
            sleep 10
          done
          echo 'Netlify preview did not become available with the Safe Cracker sample mix v11 and current gameplay safeguards.' >&2
          exit 1
