name: Temporary Safe Cleanup Pass

on:
  push:
    branches: [lamp-development]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-pass]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
          fetch-depth: 0
      - name: Remove only confirmed-dead files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dead-files.txt <<'EOF'
          assets/coin-heads.png
          assets/coin-tails.png
          assets/coin-flip.gif
          assets/roulette/atmosphere-edge-fallback.js
          assets/roulette/atmosphere-settings.css
          assets/roulette/atmosphere-settings.js
          assets/roulette/revolver-steel-walnut.png
          assets/roulette/revolver-steel-walnut-hammer.png
          assets/roulette/decor/workshop-lamp-v1113-clean.png
          assets/roulette/decor/workshop-lamp-v1114-clean.png
          assets/roulette/decor/workshop-lamp-image2.png
          assets/roulette/decor/workshop-lamp-reference.png
          assets/roulette/decor/workshop-lamp-reference@3x.png
          assets/roulette/decor/chair-left.png
          assets/roulette/decor/chair-right.png
          assets/roulette/decor/chair-back.png
          assets/roulette/audio/freesound_community-pistol-hammer-cocking-back-4-39887 (1).mp3
          assets/roulette/audio/freesound_community-cocking-a-revolver-6279 (1).mp3
          assets/roulette/audio/spinopel-dry-fire-gun-364844 (1).mp3
          assets/roulette/audio/freesound_community-revolver-spin-96947 (1).mp3
          assets/roulette/audio/freesound_community-revolver-chamber-spin-ratchet-sound-90521 (1).mp3
          assets/roulette/audio/freesound_community-chain-6073 (1).mp3
          assets/roulette/audio/freesound_community-single-pistol-gunshot-33-37187 (1).mp3
          scripts/patch-roulette-media-settings.mjs
          scripts/validate-roulette-media-settings.mjs
          REMOTE_BOT_COUNTDOWN_DIRECTION_FIX_V66.txt
          REMOTE_BOT_LEGACY_FLASH_SCROLL_FIX_V68.txt
          REMOTE_BOT_ROULETTE_REQUEST_RESPONSIVENESS_V72.txt
          REMOTE_BOT_ROULETTE_RESPONSIVENESS_CHAMBER_FIX_V71.txt
          REMOTE_BOT_ROULETTE_ROOT_FIX_V70.txt
          REMOTE_BOT_SIMPLE_ROULETTE_COUNTDOWN_V69.txt
          REMOTE_BOT_VIEWPORT_COUNTDOWN_SPIN_FIX_V67.txt
          V106_REFERENCE_LAMP_SCENE_UPDATE.txt
          V111_2_CHANGES.txt
          V77_UPDATE_NOTES.txt
          V79_UPDATE_NOTES.txt
          V80_UPDATE_NOTES.txt
          V81_LIGHTING_UPDATE.txt
          V83_LIGHTING_UPDATE.txt
          V85_LIGHTING_UPDATE.txt
          EOF
          sed -i 's/^          //' /tmp/dead-files.txt
          while IFS= read -r path; do
            test -n "$path" || continue
            git rm -f --ignore-unmatch -- "$path"
          done < /tmp/dead-files.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run complete Netlify build and validators
        run: npm run build
      - name: Verify protected animation hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes remained to commit."
            exit 0
          fi
          git commit -m "Remove confirmed unused files [cleanup-pass]"
          git push origin HEAD:lamp-development
