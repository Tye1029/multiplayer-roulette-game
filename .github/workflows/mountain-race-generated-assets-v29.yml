name: Summit Sprint Generated Assets V29

on:
  pull_request:
    branches:
      - safe-cracker-development
  push:
    branches:
      - mountain-race-development

concurrency:
  group: summit-sprint-generated-assets-v29-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-generated-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build exact Netlify output
        run: npm run build

      - name: Validate direct high-resolution V29 visuals
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-mountain-race-generated-assets-v29.mjs
          node --check scripts/validate-mountain-race-generated-assets-v29.mjs
          node scripts/validate-mountain-race-generated-assets-v29.mjs

          node scripts/validate-mountain-race-input-rebase-v8.mjs
          node scripts/validate-mountain-race-fast-ack-v9.mjs
          node scripts/validate-mountain-race-terminal-poll-v10.mjs
          node scripts/validate-mountain-race-lifecycle-guard-v11.mjs
          node scripts/validate-mountain-race-state-sync.mjs
          node scripts/validate-mountain-race-start-stability.mjs
          node scripts/validate-mountain-race-gameplay-visibility.mjs
          node scripts/validate-mountain-race-load-performance.mjs

          grep -Fq 'MOUNTAIN_RACE_GENERATED_ASSETS_V29' assets/mountain-race/mountain-race.css
          grep -Fq 'MOUNTAIN_RACE_GENERATED_ASSETS_V29' assets/mountain-race/mountain-race-multiplayer.js
          grep -Fq 'visual=33' index.html
          grep -Fq 'visual=33' mountain-race-preview.html
          test -s assets/mountain-race/images/summit-sprint-sky-v29.png
          test -s assets/mountain-race/images/summit-sprint-cliff-left-v29.png
          test -s assets/mountain-race/images/summit-sprint-cliff-right-v29.png
          test -s assets/mountain-race/images/summit-sprint-start-left-v29.png
          test -s assets/mountain-race/images/summit-sprint-start-right-v29.png
          test -s assets/mountain-race/images/summit-sprint-summit-left-v29.png
          test -s assets/mountain-race/images/summit-sprint-summit-right-v29.png
          test -s assets/mountain-race/images/summit-sprint-hold-1-v29.png
          test -s assets/mountain-race/images/summit-sprint-hold-2-v29.png
          test -s assets/mountain-race/images/summit-sprint-hold-3-v29.png

          test -s assets/safe-cracker/safe-cracker.js
          test -s assets/safe-cracker/safe-cracker.css
          test -s assets/roulette/turn-animation.js
          test -s assets/roulette/turn-fire.js
          test -s assets/roulette/audio-bindings.js

      - name: Verify live Netlify V29 deployment
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-20--famous-piroshki-b621da.netlify.app/'
          for attempt in $(seq 1 72); do
            page="$(curl -fsSL --max-time 20 "${url}?summit_generated_v29=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race-multiplayer.js?visual=33&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            styles="$(curl -fsSL --max-time 20 "${url}assets/mountain-race/mountain-race.css?visual=33&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            scene_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-sky-v29.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            cliff_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-cliff-left-v29.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            hold_headers="$(curl -fsSI --max-time 20 "${url}assets/mountain-race/images/summit-sprint-hold-1-v29.png?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq 'visual=33' <<<"$page" && \
               grep -Fq 'MOUNTAIN_RACE_GENERATED_ASSETS_V29' <<<"$runtime" && \
               grep -Fq 'MOUNTAIN_RACE_GENERATED_ASSETS_V29' <<<"$styles" && \
               grep -Fqi 'content-type: image/png' <<<"$scene_headers" && \
               grep -Fqi 'content-type: image/png' <<<"$cliff_headers" && \
               grep -Fqi 'content-type: image/png' <<<"$hold_headers"; then
              echo "Verified live Summit Sprint V29 assets at ${url}"
              exit 0
            fi
            echo "Waiting for Netlify Summit Sprint V29 (${attempt}/72)..."
            sleep 10
          done
          echo 'Netlify did not serve the Summit Sprint V29 generated assets.' >&2
          exit 1
