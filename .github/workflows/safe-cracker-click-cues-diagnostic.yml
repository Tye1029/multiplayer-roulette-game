name: Safe Cracker Click Cues Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  click-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated uploaded PCM dial
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-dial-sample-v18.mjs
          grep -Fq 'SAFE_CRACKER_UPLOADED_PCM_V25_START' assets/safe-cracker/safe-cracker.js
          grep -Fq 'SAFE_CRACKER_UPLOADED_CLICK_PCM_V25' assets/safe-cracker/safe-cracker.js
          grep -Fq 'SAFE_CRACKER_UPLOADED_CLICK_RATE_V25 = 16000' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerBuildUploadedClickPcmV25' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerUnlockUploadedClickPcmV25' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerFireUploadedClickPcmV25' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayUploadedPcmDetentV25' assets/safe-cracker/safe-cracker.js
          grep -Fq 'gain.connect(context.destination);' assets/safe-cracker/safe-cracker.js
          grep -Fq 'source.start(context.currentTime);' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerStartSmoothVaultRoomToneV25' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayIncorrectRejectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq '&clicks=25' index.html
          ! grep -Fq 'SAFE_CRACKER_DIAL_PCM_V24_START' assets/safe-cracker/safe-cracker.js
          ! grep -Fq 'safeCrackerBuildMechanicalPcmV24' assets/safe-cracker/safe-cracker.js

      - name: Verify live uploaded PCM dial
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          local_sample='assets/safe-cracker/audio-data-v3/bank-vault-dial-click-1.b64'
          expected_bytes="$(tr -d '[:space:]' < "$local_sample" | base64 -d | wc -c | tr -d ' ')"
          expected_hash="$(tr -d '[:space:]' < "$local_sample" | base64 -d | sha256sum | awk '{print $1}')"

          for attempt in $(seq 1 48); do
            html="$(curl -fsSL --max-time 20 "${url}?clicks=25&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?clicks=25&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            sample="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/audio-data-v3/bank-vault-dial-click-1.b64?clicks=25&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            sample_bytes="$(printf '%s' "$sample" | tr -d '[:space:]' | base64 -d 2>/dev/null | wc -c | tr -d ' ' || true)"
            sample_hash="$(printf '%s' "$sample" | tr -d '[:space:]' | base64 -d 2>/dev/null | sha256sum | awk '{print $1}' || true)"

            if grep -Fq '&clicks=25' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_UPLOADED_PCM_V25_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_UPLOADED_CLICK_PCM_V25' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_UPLOADED_CLICK_RATE_V25 = 16000' <<<"$js" && \
               grep -Fq 'safeCrackerBuildUploadedClickPcmV25' <<<"$js" && \
               grep -Fq 'window.atob(SAFE_CRACKER_UPLOADED_CLICK_PCM_V25)' <<<"$js" && \
               grep -Fq 'safeCrackerUnlockUploadedClickPcmV25' <<<"$js" && \
               grep -Fq 'safeCrackerFireUploadedClickPcmV25' <<<"$js" && \
               grep -Fq 'safeCrackerPlayUploadedPcmDetentV25' <<<"$js" && \
               grep -Fq 'gain.connect(context.destination);' <<<"$js" && \
               grep -Fq 'source.start(context.currentTime);' <<<"$js" && \
               grep -Fq 'safeCrackerStartSmoothVaultRoomToneV25' <<<"$js" && \
               grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' <<<"$js" && \
               grep -Fq 'safeCrackerPlayIncorrectRejectCue' <<<"$js" && \
               ! grep -Fq 'SAFE_CRACKER_DIAL_PCM_V24_START' <<<"$js" && \
               ! grep -Fq 'safeCrackerBuildMechanicalPcmV24' <<<"$js" && \
               [[ "$sample_bytes" == "$expected_bytes" ]] && \
               [[ "$sample_hash" == "$expected_hash" ]] && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker uploaded PCM dial v25 at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker uploaded PCM dial v25 (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the Safe Cracker v25 uploaded PCM waveform, direct WebAudio route, smooth room tone, and protected result cues.' >&2
          exit 1
