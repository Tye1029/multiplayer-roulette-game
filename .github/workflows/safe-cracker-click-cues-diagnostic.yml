name: Safe Cracker Click Cues Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  click-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated bank-vault dial samples
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-dial-sample-v18.mjs
          grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V18_START' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerLoadBankVaultDialSamples' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayBankVaultDialSample' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayRecordedBankVaultDetent' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayIncorrectRejectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq '&clicks=18' index.html

      - name: Verify live Netlify bank-vault dial samples
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 48); do
            html="$(curl -fsSL --max-time 20 "${url}?clicks=18&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?clicks=18&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            sample1="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/audio-data-v3/bank-vault-dial-click-1.b64?clicks=18&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            sample6="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/audio-data-v3/bank-vault-dial-click-6.b64?clicks=18&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            sample1_hash="$(printf '%s' "$sample1" | tr -d '[:space:]' | base64 -d 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            sample6_hash="$(printf '%s' "$sample6" | tr -d '[:space:]' | base64 -d 2>/dev/null | sha256sum | awk '{print $1}' || true)"

            if grep -Fq '&clicks=18' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V18_START' <<<"$js" && \
               grep -Fq 'safeCrackerLoadBankVaultDialSamples' <<<"$js" && \
               grep -Fq 'safeCrackerPlayBankVaultDialSample' <<<"$js" && \
               grep -Fq 'safeCrackerPlayRecordedBankVaultDetent' <<<"$js" && \
               grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' <<<"$js" && \
               grep -Fq 'safeCrackerPlayIncorrectRejectCue' <<<"$js" && \
               [[ "$sample1_hash" == 'cc8a6c2c74db52e6724dc8701426f9fa193b597010061707817d42b417a9187a' ]] && \
               [[ "$sample6_hash" == 'b713dc148e2a5b83fbf1b7c5055b04210c8818d32cae458b7db119f59cf0d37c' ]] && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker bank-vault dial samples v18 at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker bank-vault dial samples v18 (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the Safe Cracker bank-vault dial sample v18 runtime and exact assets.' >&2
          exit 1
