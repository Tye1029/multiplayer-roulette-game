name: Safe Cracker Click Cues Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  click-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated embedded metallic click
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-dial-sample-v18.mjs
          grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V23_START' assets/safe-cracker/safe-cracker.js
          grep -Fq 'SAFE_CRACKER_METALLIC_CLICK_V23 = "data:audio/mpeg;base64,' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerCreateMetallicVoiceV23' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPrepareMetallicVoicesV23' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerUnlockMetallicVoicesV23' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayExactMetallicClickV23' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayEmbeddedMetallicDetentV23' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerStartSmoothVaultRoomToneV23' assets/safe-cracker/safe-cracker.js
          grep -Fq 'voice.volume = 1;' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayIncorrectRejectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq '&clicks=23' index.html
          ! grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V22_START' assets/safe-cracker/safe-cracker.js
          ! grep -Fq 'safeCrackerPlayDryDialFallbackV22' assets/safe-cracker/safe-cracker.js

      - name: Verify live embedded metallic click
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          expected_hash='0ecdc10f4f71dcbd670e2accee467543c898a67c814341db4981be82eaae7196'

          for attempt in $(seq 1 48); do
            html="$(curl -fsSL --max-time 20 "${url}?clicks=23&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?clicks=23&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            sample="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/audio-data-v3/bank-vault-dial-click-1.b64?clicks=23&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            sample_bytes="$(printf '%s' "$sample" | tr -d '[:space:]' | base64 -d 2>/dev/null | wc -c | tr -d ' ' || true)"
            sample_magic="$(printf '%s' "$sample" | tr -d '[:space:]' | base64 -d 2>/dev/null | head -c 3 || true)"
            sample_hash="$(printf '%s' "$sample" | tr -d '[:space:]' | base64 -d 2>/dev/null | sha256sum | awk '{print $1}' || true)"

            if grep -Fq '&clicks=23' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V23_START' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_METALLIC_CLICK_V23 = "data:audio/mpeg;base64,' <<<"$js" && \
               grep -Fq 'safeCrackerCreateMetallicVoiceV23' <<<"$js" && \
               grep -Fq 'safeCrackerPlayExactMetallicClickV23' <<<"$js" && \
               grep -Fq 'safeCrackerPlayEmbeddedMetallicDetentV23' <<<"$js" && \
               grep -Fq 'safeCrackerStartSmoothVaultRoomToneV23' <<<"$js" && \
               grep -Fq 'voice.volume = 1;' <<<"$js" && \
               grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' <<<"$js" && \
               grep -Fq 'safeCrackerPlayIncorrectRejectCue' <<<"$js" && \
               ! grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V22_START' <<<"$js" && \
               ! grep -Fq 'safeCrackerPlayDryDialFallbackV22' <<<"$js" && \
               [[ "$sample_bytes" -ge 5400 && "$sample_bytes" -le 5700 ]] && \
               [[ "$sample_magic" == 'ID3' ]] && \
               [[ "$sample_hash" == "$expected_hash" ]] && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker embedded metallic click v23 at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker embedded metallic click v23 (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the Safe Cracker v23 embedded metallic click, exact MP3 checksum, smooth room tone, and protected result cues.' >&2
          exit 1
