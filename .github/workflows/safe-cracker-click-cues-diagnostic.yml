name: Safe Cracker Click Cues Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  click-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated synchronous PCM dial
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-dial-sample-v18.mjs
          grep -Fq 'SAFE_CRACKER_DIAL_PCM_V24_START' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerBuildMechanicalPcmV24' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerUnlockMechanicalPcmV24' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerFireMechanicalPcmV24' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayMechanicalPcmDetentV24' assets/safe-cracker/safe-cracker.js
          grep -Fq 'gain.connect(context.destination);' assets/safe-cracker/safe-cracker.js
          grep -Fq 'source.start(context.currentTime);' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerStartSmoothVaultRoomToneV24' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayIncorrectRejectCue' assets/safe-cracker/safe-cracker.js
          grep -Fq '&clicks=24' index.html
          ! grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V23_START' assets/safe-cracker/safe-cracker.js
          ! grep -Fq 'new Audio(SAFE_CRACKER_METALLIC_CLICK' assets/safe-cracker/safe-cracker.js

      - name: Verify live synchronous PCM dial
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 48); do
            html="$(curl -fsSL --max-time 20 "${url}?clicks=24&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?clicks=24&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq '&clicks=24' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_DIAL_PCM_V24_START' <<<"$js" && \
               grep -Fq 'safeCrackerBuildMechanicalPcmV24' <<<"$js" && \
               grep -Fq 'context.createBuffer(1, length, context.sampleRate)' <<<"$js" && \
               grep -Fq 'safeCrackerUnlockMechanicalPcmV24' <<<"$js" && \
               grep -Fq 'safeCrackerFireMechanicalPcmV24' <<<"$js" && \
               grep -Fq 'safeCrackerPlayMechanicalPcmDetentV24' <<<"$js" && \
               grep -Fq 'gain.connect(context.destination);' <<<"$js" && \
               grep -Fq 'source.start(context.currentTime);' <<<"$js" && \
               grep -Fq 'safeCrackerStartSmoothVaultRoomToneV24' <<<"$js" && \
               grep -Fq 'safeCrackerPlayAuthoritativeCorrectCue' <<<"$js" && \
               grep -Fq 'safeCrackerPlayIncorrectRejectCue' <<<"$js" && \
               ! grep -Fq 'SAFE_CRACKER_DIAL_SAMPLE_V23_START' <<<"$js" && \
               ! grep -Fq 'new Audio(SAFE_CRACKER_METALLIC_CLICK' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker synchronous PCM dial v24 at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker synchronous PCM dial v24 (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the Safe Cracker v24 synchronous PCM dial, smooth room tone, and protected result cues.' >&2
          exit 1
