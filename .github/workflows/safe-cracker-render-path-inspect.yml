name: Safe Cracker Render Path Inspect

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build patched Safe Cracker runtime
        run: npm run build
      - name: Print Safe Cracker runtime paths
        run: node scripts/inspect-safe-cracker-render-path.mjs
