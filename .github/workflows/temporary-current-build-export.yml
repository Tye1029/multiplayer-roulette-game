name: Temporary Current Build Export

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact preserved build
        uses: actions/checkout@v4
        with:
          ref: bc1a2c9a8d6a2cf8fa91f57572b3b831dbafe5eb
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run Netlify build
        run: npm run build
      - name: Package preserved build
        run: |
          zip -r multiplayer-roulette-current-build-bc1a2c9.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x '.github/workflows/temporary-current-build-export.yml'
      - name: Upload preserved build
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-roulette-current-build-bc1a2c9
          path: multiplayer-roulette-current-build-bc1a2c9.zip
          if-no-files-found: error
          retention-days: 7
