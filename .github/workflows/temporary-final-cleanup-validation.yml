name: Temporary Final Cleanup Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run complete Netlify build and validators
        run: npm run build
      - name: Verify cleanup and protected files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e assets/coin-flip.gif
          test ! -e assets/coin-heads.png
          test ! -e assets/coin-tails.png
          test ! -e assets/roulette/atmosphere-settings.js
          test ! -e assets/roulette/atmosphere-settings.css
          test ! -e assets/roulette/atmosphere-edge-fallback.js
          test ! -d node_modules/.git
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
