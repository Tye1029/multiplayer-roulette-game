name: Safe Cracker Dial Layout Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  dial-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated dial layout
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SAFE_CRACKER_DIAL_LAYOUT_V2_START' assets/safe-cracker/safe-cracker.css
          grep -Fq -- '--radius: 96px' assets/safe-cracker/safe-cracker.css
          grep -Fq 'clip-path: polygon(14% 0, 86% 0, 50% 100%)' assets/safe-cracker/safe-cracker.css
          grep -Fq "button[data-sc-step='-1']::before" assets/safe-cracker/safe-cracker.css
          grep -Fq 'color: #fff6d9' assets/safe-cracker/safe-cracker.css
          grep -Fq '0 3px 9px rgba(0,0,0,.34)' assets/safe-cracker/safe-cracker.css
          ! grep -Fq '0 6px 0 #1a1007' assets/safe-cracker/safe-cracker.css
          grep -Fq '/assets/safe-cracker/textures/dial-reference-face-v7.svg?dial=7&layout=3' assets/safe-cracker/safe-cracker.js
          grep -Fq '&dial=7&layout=3' index.html

      - name: Verify live Netlify dial layout
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"

          for attempt in $(seq 1 42); do
            html="$(curl -fsSL --max-time 20 "${url}?dial_layout=3&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.css?v=8&polish=2&dial=7&layout=3&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&dial=7&layout=3&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"

            if grep -Fq '&dial=7&layout=3' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_DIAL_LAYOUT_V2_START' <<<"$css" && \
               grep -Fq -- '--radius: 96px' <<<"$css" && \
               grep -Fq 'top: -44px' <<<"$css" && \
               grep -Fq 'width: 24px' <<<"$css" && \
               grep -Fq 'clip-path: polygon(14% 0, 86% 0, 50% 100%)' <<<"$css" && \
               grep -Fq "button[data-sc-step='-1']::before" <<<"$css" && \
               grep -Fq 'linear-gradient(180deg, #c69b52 0%, #8c6633 48%, #5c3f1c 100%)' <<<"$css" && \
               grep -Fq '0 3px 9px rgba(0,0,0,.34)' <<<"$css" && \
               ! grep -Fq '0 6px 0 #1a1007' <<<"$css" && \
               grep -Fq '/assets/safe-cracker/textures/dial-reference-face-v7.svg?dial=7&layout=3' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live Safe Cracker dial layout v2 at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify Safe Cracker dial-layout v2 preview (${attempt}/42)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the refined Safe Cracker dial layout v2 and current gameplay safeguards.' >&2
          exit 1
