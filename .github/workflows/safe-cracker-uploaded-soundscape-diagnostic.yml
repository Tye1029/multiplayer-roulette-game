name: Safe Cracker Uploaded Soundscape Diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - safe-cracker-development

permissions:
  contents: read

jobs:
  uploaded-soundscape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run exact Netlify build command
        run: npm run build

      - name: Verify generated uploaded soundscape
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-safe-cracker-uploaded-soundscape.mjs
          grep -Fq 'SAFE_CRACKER_UPLOADED_SOUNDSCAPE_V1_START' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayUploadedDetent' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerPlayUploadedFeedback' assets/safe-cracker/safe-cracker.js
          grep -Fq 'safeCrackerStartUploadedAmbience' assets/safe-cracker/safe-cracker.js
          grep -Fq '&soundscape=1' index.html

      - name: Verify live Netlify uploaded soundscape
        shell: bash
        run: |
          set -euo pipefail
          url='https://deploy-preview-19--famous-piroshki-b621da.netlify.app/'
          function_url="${url}.netlify/functions/duel-action"
          samples=(
            intro-sequence
            dial-detent-a
            dial-detent-b
            incorrect-number
            correct-latch-open
            final-vault-open
            vault-ambience-loop
            submit-mechanism
          )

          for attempt in $(seq 1 48); do
            html="$(curl -fsSL --max-time 20 "${url}?uploaded_soundscape=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/safe-cracker.js?v=8&polish=2&soundscape=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            headers="$(curl -fsS --max-time 20 -D - -o /dev/null -X OPTIONS "${function_url}?commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            assets_ok=1
            for sample in "${samples[@]}"; do
              encoded="$(curl -fsSL --max-time 20 "${url}assets/safe-cracker/audio-data-v2/${sample}.b64?soundscape=1&commit=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
              if [ "${#encoded}" -lt 1500 ]; then
                assets_ok=0
                break
              fi
              signature="$(printf '%s' "$encoded" | base64 -d 2>/dev/null | head -c 3 | xxd -p || true)"
              if [[ "$signature" != 494433 && "$signature" != ff* ]]; then
                assets_ok=0
                break
              fi
            done

            if [ "$assets_ok" -eq 1 ] && \
               grep -Fq '&soundscape=1' <<<"$html" && \
               grep -Fq 'SAFE_CRACKER_UPLOADED_SOUNDSCAPE_V1_START' <<<"$js" && \
               grep -Fq 'safeCrackerPlayUploadedDetent' <<<"$js" && \
               grep -Fq 'safeCrackerPlayUploadedFeedback' <<<"$js" && \
               grep -Fq 'safeCrackerStartUploadedAmbience' <<<"$js" && \
               grep -Fq 'SAFE_CRACKER_DIAL_ACTIVITY_V16_START' <<<"$js" && \
               grep -Fiq 'x-duel-function-build: safecracker-direct-v8' <<<"$headers"; then
              echo "Verified live uploaded Safe Cracker soundscape at ${url}"
              exit 0
            fi

            echo "Waiting for Netlify uploaded Safe Cracker soundscape (${attempt}/48)..."
            sleep 10
          done

          echo 'Netlify preview did not serve the uploaded Safe Cracker soundscape and protected runtime.' >&2
          exit 1
