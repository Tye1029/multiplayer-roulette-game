name: Temporary Create And Facing Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lamp-development
        uses: actions/checkout@v4
        with:
          ref: lamp-development
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run complete Netlify build and validators
        run: npm run build
      - name: Verify create and facing outputs
        run: |
          grep -Fq 'const timeoutMs = action === "create" ? 30000 : 10000;' index.html
          grep -Fq 'clientGameId: pending.gameId' index.html
          grep -Fq 'if(options?.scanFallback===false) return null;' netlify/functions/_data.js
          grep -Fq 'clientGameId: body.clientGameId' netlify/functions/duel-action.js
          grep -Fq "pre-opening-default-left" assets/roulette/turn-facing-guard.js
          ! grep -Fq 'Finish or cancel your current game before creating another one.' index.html
      - name: Verify protected animation hashes
        run: |
          test "$(git hash-object assets/roulette/turn-animation.js)" = "24358e84c147d99e7297089e69ed1abd0802379f"
          test "$(git hash-object assets/roulette/turn-fire.js)" = "940e824eae39ddc40dda6200f893f97fc365949b"
