name: Build TerrorCounter No-INI BA2

on:
  pull_request:
    branches:
      - chatgpt/terrorcounter-noini-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'chatgpt/terrorcounter-noini'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify ActionScript sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chatgpt-noini/src
          tr -d '[:space:]' < chatgpt-noini/TerrorCounter.as.gz.b64 | base64 -d | gzip -dc > chatgpt-noini/src/TerrorCounter.as
          tr -d '[:space:]' < chatgpt-noini/TerrorCounterAutoLoader.as.gz.b64 | base64 -d | gzip -dc > chatgpt-noini/src/TerrorCounterAutoLoader.as
          echo 'cd726d4ea47e13b0fdc7b6f14367c379da87222ae17d2a9fb2a603d66e5ea826  chatgpt-noini/src/TerrorCounter.as' | sha256sum -c -
          echo '8a636c2539d630479df43888bb1e8a45958d9559862e152c52ce27a1a17faf1d  chatgpt-noini/src/TerrorCounterAutoLoader.as' | sha256sum -c -

      - name: Install Apache Flex compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            -o /tmp/flex.tar.gz \
            https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          mkdir -p "$RUNNER_TEMP/flex"
          tar -xzf /tmp/flex.tar.gz -C "$RUNNER_TEMP/flex" --strip-components=1
          chmod +x "$RUNNER_TEMP/flex/bin/mxmlc"
          git clone --depth 1 https://github.com/nexussays/playerglobal.git "$RUNNER_TEMP/playerglobal"
          mkdir -p "$RUNNER_TEMP/flex/frameworks/libs/player/11.1"
          cp "$RUNNER_TEMP/playerglobal/11.1/playerglobal.swc" \
             "$RUNNER_TEMP/flex/frameworks/libs/player/11.1/playerglobal.swc"

      - name: Compile TerrorCounter and auto-loader SWFs
        shell: bash
        run: |
          set -euo pipefail
          export FLEX_HOME="$RUNNER_TEMP/flex"
          export PLAYERGLOBAL_HOME="$RUNNER_TEMP/flex/frameworks/libs/player"
          mkdir -p build/package/Interface
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.1 \
            -swf-version=14 \
            -default-size=1920,1080 \
            -debug=false \
            -optimize=true \
            -static-link-runtime-shared-libraries=true \
            -output="$GITHUB_WORKSPACE/build/package/Interface/TerrorCounter.swf" \
            "$GITHUB_WORKSPACE/chatgpt-noini/src/TerrorCounter.as"
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.1 \
            -swf-version=14 \
            -default-size=1920,1080 \
            -debug=false \
            -optimize=true \
            -static-link-runtime-shared-libraries=true \
            -output="$GITHUB_WORKSPACE/build/package/Interface/hudmodloader.swf" \
            "$GITHUB_WORKSPACE/chatgpt-noini/src/TerrorCounterAutoLoader.as"
          python3 - <<'PY'
          from pathlib import Path
          for name in ('TerrorCounter.swf','hudmodloader.swf'):
              p=Path('build/package/Interface')/name
              data=p.read_bytes()
              assert data[:3] in (b'FWS',b'CWS',b'ZWS'), (name,data[:3])
              assert len(data) > 1000, (name,len(data))
              print(name, len(data), data[:3].decode('ascii'))
          PY

      - name: Install BA2 archive tool
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/DreamWeave-MP/dream_archivetool.git \
            --locked --root "$RUNNER_TEMP/dream-tools"
          "$RUNNER_TEMP/dream-tools/bin/dream_archivetool" --help >/dev/null

      - name: Package and verify no-INI BA2
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$RUNNER_TEMP/dream-tools/bin/dream_archivetool"
          "$TOOL" create \
            build/TerrorCounter_NoINI.ba2 \
            build/package \
            --format ba2 \
            --ba2-kind gnrl
          "$TOOL" verify build/TerrorCounter_NoINI.ba2 --read-payloads --json > build/verify.json
          "$TOOL" list build/TerrorCounter_NoINI.ba2 --json > build/list.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          entries=json.loads(Path('build/list.json').read_text())
          paths=sorted(e['path'].lower() for e in entries)
          expected=['interface/hudmodloader.swf','interface/terrorcounter.swf']
          assert paths == expected, (paths, expected)
          verify=json.loads(Path('build/verify.json').read_text())
          print('BA2 entries:', paths)
          print('BA2 verify:', verify)
          PY
          sha256sum build/TerrorCounter_NoINI.ba2 | tee build/TerrorCounter_NoINI.ba2.sha256.txt

      - name: Upload finished no-INI BA2
        uses: actions/upload-artifact@v4
        with:
          name: TerrorCounter-NoINI-BA2
          path: |
            build/TerrorCounter_NoINI.ba2
            build/TerrorCounter_NoINI.ba2.sha256.txt
            build/verify.json
            build/list.json
          if-no-files-found: error
          retention-days: 1
