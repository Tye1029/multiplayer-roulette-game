name: Build TerrorCounter v0.10 Raid Telemetry

on:
  pull_request:
    branches:
      - chatgpt/terrorcounter-raid-runner

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify ActionScript source
        shell: bash
        run: |
          set -euo pipefail
          tr -d '[:space:]' < chatgpt-build/TerrorCounter.as.gz.b64 | base64 -d | gzip -dc > chatgpt-build/TerrorCounter.as
          echo 'cd726d4ea47e13b0fdc7b6f14367c379da87222ae17d2a9fb2a603d66e5ea826  chatgpt-build/TerrorCounter.as' | sha256sum -c -

      - name: Replace HUD text with vector glyph renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/vector_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'TERROR KILLS:' chatgpt-build/TerrorCounter.as
          test "$(grep -c 'counterText' chatgpt-build/TerrorCounter.as)" -eq 1

      - name: Fix persistent count restore
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/persistence_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'restored count=' chatgpt-build/TerrorCounter.as
          grep -F '!storageLoaded' chatgpt-build/TerrorCounter.as
          grep -F 'SharedObject.getLocal("TerrorCounterState")' chatgpt-build/TerrorCounter.as
          grep -F 'saveLocalState();' chatgpt-build/TerrorCounter.as

      - name: Add session persistence and reset hotkey
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/v05_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'private static var sessionCount:int = 0;' chatgpt-build/TerrorCounter.as

      - name: Fix ZFE bridge discovery for Game Pass HUD
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/v06_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'verifiedBridgeOnFirstLevelChildren' chatgpt-build/TerrorCounter.as
          grep -F 'getRuntimeInfo' chatgpt-build/TerrorCounter.as
          grep -F 'saved count=' chatgpt-build/TerrorCounter.as

      - name: Disable false raid-reward kill fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/v07_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'Intentionally disabled in v0.7' chatgpt-build/TerrorCounter.as
          grep -F 'Never carry an armed encounter across a HUD/game reload.' chatgpt-build/TerrorCounter.as
          grep -F 'registerAutomaticKill("encounter_health_zero")' chatgpt-build/TerrorCounter.as
          ! grep -F 'registerAutomaticKill("raid_reward")' chatgpt-build/TerrorCounter.as

      - name: Add dedicated correction hotkeys
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/v08_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'manual reset via Ctrl+Alt+R' chatgpt-build/TerrorCounter.as

      - name: Replace raw hotkeys with official HUDTools menu
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/v09_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'getDefinitionByName("SharedHUDTools")' chatgpt-build/TerrorCounter.as
          grep -F 'tools.RegisterMenu(onSharedBuildMenu,onSharedSelectMenu);' chatgpt-build/TerrorCounter.as
          grep -F 'Current Kills: ' chatgpt-build/TerrorCounter.as
          grep -F 'manual reset via HUDTools' chatgpt-build/TerrorCounter.as
          ! grep -F 'stage.addEventListener(KeyboardEvent.KEY_DOWN, onResetHotkey);' chatgpt-build/TerrorCounter.as

      - name: Add integrated Gleaming Depths telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 chatgpt-build/raid_telemetry_patch.py chatgpt-build/TerrorCounter.as
          grep -F 'TerrorCounter v0.10 integrated raid telemetry active' chatgpt-build/TerrorCounter.as
          grep -F 'private function raidTelemetryTick(now:Number):void' chatgpt-build/TerrorCounter.as
          grep -F 'raid-position-delta' chatgpt-build/TerrorCounter.as
          grep -F 'respawn-window' chatgpt-build/TerrorCounter.as
          if grep -Eqi 'setposition|setpos|teleport|writeprocessmemory|noclip' chatgpt-build/TerrorCounter.as; then
            echo 'Unexpected movement/manipulation primitive found in telemetry source' >&2
            exit 1
          fi

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Apache Flex compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 2 -o /tmp/flex.tar.gz https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          mkdir -p "$RUNNER_TEMP/flex"
          tar -xzf /tmp/flex.tar.gz -C "$RUNNER_TEMP/flex" --strip-components=1
          chmod +x "$RUNNER_TEMP/flex/bin/mxmlc"
          git clone --depth 1 https://github.com/nexussays/playerglobal.git "$RUNNER_TEMP/playerglobal"

      - name: Compile TerrorCounter SWF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/Interface
          export FLEX_HOME="$RUNNER_TEMP/flex"
          export PLAYERGLOBAL_HOME="$RUNNER_TEMP/playerglobal"
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.1 \
            -swf-version=14 \
            -default-size=1920,1080 \
            -debug=false \
            -optimize=true \
            -static-link-runtime-shared-libraries=true \
            -output="$GITHUB_WORKSPACE/build/package/Interface/TerrorCounter.swf" \
            "$GITHUB_WORKSPACE/chatgpt-build/TerrorCounter.as"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/package/Interface/TerrorCounter.swf')
          assert p.exists() and p.stat().st_size > 0
          assert p.read_bytes()[:3] in (b'FWS', b'CWS', b'ZWS')
          print('valid SWF', p.stat().st_size, p.read_bytes()[:3])
          PY

      - name: Install BA2 archive tool
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/DreamWeave-MP/dream_archivetool.git --locked --root "$RUNNER_TEMP/dream-tools"

      - name: Package and verify TerrorCounter BA2
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$RUNNER_TEMP/dream-tools/bin/dream_archivetool"
          OUT="build/TerrorCounter_v0.10_RaidTelemetry.ba2"
          "$TOOL" create "$OUT" build/package --format ba2 --ba2-kind gnrl --ba2-version fallout4
          "$TOOL" list --long "$OUT" | tee build/ba2-list.txt
          "$TOOL" verify "$OUT" --read-payloads --json | tee build/ba2-verify.json
          grep -Eqi 'interface[/\\]terrorcounter\.swf' build/ba2-list.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/TerrorCounter_v0.10_RaidTelemetry.ba2')
          assert p.exists() and p.stat().st_size > 0
          assert p.read_bytes()[:4] == b'BTDX'
          print('valid BA2', p.stat().st_size, p.read_bytes()[:4])
          PY
          sha256sum "$OUT" | tee build/TerrorCounter_v0.10_RaidTelemetry.ba2.sha256.txt

      - name: Upload finished BA2
        uses: actions/upload-artifact@v4
        with:
          name: TerrorCounter-v0.10-RaidTelemetry-BA2
          path: |
            build/TerrorCounter_v0.10_RaidTelemetry.ba2
            build/TerrorCounter_v0.10_RaidTelemetry.ba2.sha256.txt
            build/ba2-list.txt
            build/ba2-verify.json
          if-no-files-found: error
          retention-days: 1
