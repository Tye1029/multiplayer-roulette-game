name: Temporary TerrorCounter Build Runner

on:
  pull_request:
    branches:
      - chatgpt/terrorcounter-runner

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify ActionScript source
        shell: bash
        run: |
          set -euo pipefail
          tr -d '[:space:]' < chatgpt-build/TerrorCounter.as.gz.b64 | base64 -d | gzip -dc > chatgpt-build/TerrorCounter.as
          echo 'cd726d4ea47e13b0fdc7b6f14367c379da87222ae17d2a9fb2a603d66e5ea826  chatgpt-build/TerrorCounter.as' | sha256sum -c -

      - name: Replace HUD text with vector glyph renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('chatgpt-build/TerrorCounter.as')
          s = p.read_text(encoding='utf-8')

          marker = '        private var counterText:TextField;\n'
          assert marker in s, 'counterText declaration not found'
          if 'private var counterGlyphs:Sprite;' not in s:
              s = s.replace(marker, marker + '        private var counterGlyphs:Sprite;\n', 1)

          pattern = r'''        private function buildCounter\(\):void
        \{
.*?
        private function positionPanel\(\):void
'''
          replacement = r'''        private function buildCounter():void
        {
            panel = new Sprite();
            panel.mouseEnabled = false;
            panel.mouseChildren = false;
            addChild(panel);

            counterGlyphs = new Sprite();
            counterGlyphs.mouseEnabled = false;
            panel.addChild(counterGlyphs);

            redrawPanel();
        }

        private function updateCounter():void
        {
            redrawPanel();
        }

        private function redrawPanel():void
        {
            if (panel == null || counterGlyphs == null)
            {
                return;
            }

            var label:String = "TERROR KILLS: " + count;
            var textWidth:Number = drawVectorText(label, 8, 6, 2);

            panel.graphics.clear();
            panel.graphics.beginFill(0x000000, 0.38);
            panel.graphics.drawRoundRect(0, 0, textWidth + 16, 26, 8, 8);
            panel.graphics.endFill();

            positionPanel();
        }

        private function drawVectorText(text:String, startX:Number, startY:Number, pixel:Number):Number
        {
            counterGlyphs.graphics.clear();
            counterGlyphs.graphics.beginFill(0xFFFFFF, 1.0);

            var cursorX:Number = startX;
            var i:int;
            var row:int;
            var col:int;
            var ch:String;
            var glyph:Array;
            var rowBits:String;

            for (i = 0; i < text.length; i++)
            {
                ch = text.charAt(i).toUpperCase();

                if (ch == " ")
                {
                    cursorX += pixel * 4;
                    continue;
                }

                glyph = glyphFor(ch);

                for (row = 0; row < 7; row++)
                {
                    rowBits = String(glyph[row]);

                    for (col = 0; col < 5; col++)
                    {
                        if (rowBits.charAt(col) == "1")
                        {
                            counterGlyphs.graphics.drawRect(
                                cursorX + col * pixel,
                                startY + row * pixel,
                                pixel,
                                pixel
                            );
                        }
                    }
                }

                cursorX += pixel * 6;
            }

            counterGlyphs.graphics.endFill();
            return cursorX - startX;
        }

        private function glyphFor(ch:String):Array
        {
            switch (ch)
            {
                case "T": return ["11111","00100","00100","00100","00100","00100","00100"];
                case "E": return ["11111","10000","10000","11110","10000","10000","11111"];
                case "R": return ["11110","10001","10001","11110","10100","10010","10001"];
                case "O": return ["01110","10001","10001","10001","10001","10001","01110"];
                case "K": return ["10001","10010","10100","11000","10100","10010","10001"];
                case "I": return ["11111","00100","00100","00100","00100","00100","11111"];
                case "L": return ["10000","10000","10000","10000","10000","10000","11111"];
                case "S": return ["01111","10000","10000","01110","00001","00001","11110"];
                case ":": return ["00000","00100","00100","00000","00100","00100","00000"];
                case "0": return ["01110","10001","10011","10101","11001","10001","01110"];
                case "1": return ["00100","01100","00100","00100","00100","00100","01110"];
                case "2": return ["01110","10001","00001","00010","00100","01000","11111"];
                case "3": return ["11110","00001","00001","01110","00001","00001","11110"];
                case "4": return ["00010","00110","01010","10010","11111","00010","00010"];
                case "5": return ["11111","10000","10000","11110","00001","00001","11110"];
                case "6": return ["01110","10000","10000","11110","10001","10001","01110"];
                case "7": return ["11111","00001","00010","00100","01000","01000","01000"];
                case "8": return ["01110","10001","10001","01110","10001","10001","01110"];
                case "9": return ["01110","10001","10001","01111","00001","00001","01110"];
                default:  return ["00000","00000","00000","00000","00000","00000","00000"];
            }
        }

        private function positionPanel():void
'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1, 'HUD method block not found'
          assert s.count('counterText') == 1, 'runtime counterText reference remains'
          assert 'TERROR KILLS: ' in s
          assert 'drawVectorText' in s
          p.write_text(s, encoding='utf-8')
          print('vector HUD patch applied; runtime TextField removed')
          PY

      - name: Install Apache Flex compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 -o /tmp/flex.tar.gz https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          mkdir -p "$RUNNER_TEMP/flex"
          tar -xzf /tmp/flex.tar.gz -C "$RUNNER_TEMP/flex" --strip-components=1
          chmod +x "$RUNNER_TEMP/flex/bin/mxmlc"
          git clone --depth 1 https://github.com/nexussays/playerglobal.git "$RUNNER_TEMP/playerglobal"

      - name: Compile TerrorCounter SWF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/Interface
          export FLEX_HOME="$RUNNER_TEMP/flex"
          export PLAYERGLOBAL_HOME="$RUNNER_TEMP/playerglobal"
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.1 \
            -swf-version=14 \
            -default-size=1920,1080 \
            -debug=false \
            -optimize=true \
            -static-link-runtime-shared-libraries=true \
            -output="$GITHUB_WORKSPACE/build/package/Interface/TerrorCounter.swf" \
            "$GITHUB_WORKSPACE/chatgpt-build/TerrorCounter.as"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/package/Interface/TerrorCounter.swf')
          assert p.exists() and p.stat().st_size > 0
          assert p.read_bytes()[:3] in (b'FWS', b'CWS', b'ZWS')
          print('valid SWF', p.stat().st_size, p.read_bytes()[:3])
          PY

      - name: Install BA2 archive tool
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/DreamWeave-MP/dream_archivetool.git --locked --root "$RUNNER_TEMP/dream-tools"

      - name: Package and verify TerrorCounter BA2
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$RUNNER_TEMP/dream-tools/bin/dream_archivetool"
          "$TOOL" create build/TerrorCounter_v0.3.ba2 build/package --format ba2 --ba2-kind gnrl --ba2-version fallout4
          "$TOOL" list --long build/TerrorCounter_v0.3.ba2 | tee build/ba2-list.txt
          "$TOOL" verify build/TerrorCounter_v0.3.ba2 --read-payloads --json | tee build/ba2-verify.json
          grep -Eqi 'interface[/\\]terrorcounter\.swf' build/ba2-list.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/TerrorCounter_v0.3.ba2')
          assert p.exists() and p.stat().st_size > 0
          assert p.read_bytes()[:4] == b'BTDX'
          print('valid BA2', p.stat().st_size, p.read_bytes()[:4])
          PY
          sha256sum build/TerrorCounter_v0.3.ba2 | tee build/TerrorCounter_v0.3.ba2.sha256.txt

      - name: Upload finished BA2
        uses: actions/upload-artifact@v4
        with:
          name: TerrorCounter-v0.3-BA2
          path: |
            build/TerrorCounter_v0.3.ba2
            build/TerrorCounter_v0.3.ba2.sha256.txt
            build/ba2-list.txt
            build/ba2-verify.json
          if-no-files-found: error
          retention-days: 1
