name: Build Raid Checkpoint Diagnostic v0.1 BA2

on:
  pull_request:
    branches:
      - chatgpt/raid-diagnostic-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test -s chatgpt-build/RaidCheckpointDiagnostic.as
          grep -q 'class RaidCheckpointDiagnostic' chatgpt-build/RaidCheckpointDiagnostic.as
          grep -q 'QuestTrackerProvider' chatgpt-build/RaidCheckpointDiagnostic.as
          grep -q 'diagnostic-only, no movement actions are performed' chatgpt-build/RaidCheckpointDiagnostic.as
          if grep -Eqi 'setposition|setpos|teleport|writeprocessmemory|noclip' chatgpt-build/RaidCheckpointDiagnostic.as; then
            echo 'Unexpected movement/manipulation primitive found in diagnostic source' >&2
            exit 1
          fi

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download compiler and Flash API stubs
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 -o /tmp/flex.tar.gz https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz
          mkdir -p "$RUNNER_TEMP/flex"
          tar -xzf /tmp/flex.tar.gz -C "$RUNNER_TEMP/flex" --strip-components=1
          chmod +x "$RUNNER_TEMP/flex/bin/mxmlc"
          git clone --depth 1 https://github.com/nexussays/playerglobal.git "$RUNNER_TEMP/playerglobal"
          mkdir -p "$RUNNER_TEMP/flex/frameworks/libs/player/11.1"
          cp "$RUNNER_TEMP/playerglobal/11.1/playerglobal.swc" "$RUNNER_TEMP/flex/frameworks/libs/player/11.1/playerglobal.swc"

      - name: Compile SWF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package/Interface
          export FLEX_HOME="$RUNNER_TEMP/flex"
          "$FLEX_HOME/bin/mxmlc" \
            -target-player=11.1 \
            -swf-version=14 \
            -default-size=1920,1080 \
            -debug=false \
            -optimize=true \
            -static-link-runtime-shared-libraries=true \
            -output="$GITHUB_WORKSPACE/build/package/Interface/RaidCheckpointDiagnostic.swf" \
            "$GITHUB_WORKSPACE/chatgpt-build/RaidCheckpointDiagnostic.as"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/package/Interface/RaidCheckpointDiagnostic.swf')
          assert p.exists() and p.stat().st_size>0
          assert p.read_bytes()[:3] in (b'FWS',b'CWS',b'ZWS')
          print('valid SWF',p.stat().st_size,p.read_bytes()[:3])
          PY

      - name: Build BA2 tool
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/DreamWeave-MP/dream_archivetool.git --locked --root "$RUNNER_TEMP/dream-tools"

      - name: Package and verify BA2
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$RUNNER_TEMP/dream-tools/bin/dream_archivetool"
          OUT="build/RaidCheckpointDiagnostic_v0.1.ba2"
          "$TOOL" create "$OUT" build/package --format ba2 --ba2-kind gnrl --ba2-version fallout4
          "$TOOL" list --long "$OUT" | tee build/ba2-list.txt
          "$TOOL" verify "$OUT" --read-payloads --json | tee build/ba2-verify.json
          grep -Eqi 'interface[/\\]raidcheckpointdiagnostic\.swf' build/ba2-list.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/RaidCheckpointDiagnostic_v0.1.ba2')
          assert p.exists() and p.stat().st_size>0
          assert p.read_bytes()[:4]==b'BTDX'
          print('valid BA2',p.stat().st_size,p.read_bytes()[:4])
          PY
          sha256sum "$OUT" | tee build/RaidCheckpointDiagnostic_v0.1.ba2.sha256.txt

      - name: Upload finished BA2
        uses: actions/upload-artifact@v4
        with:
          name: RaidCheckpointDiagnostic-v0.1-BA2
          path: |
            build/RaidCheckpointDiagnostic_v0.1.ba2
            build/RaidCheckpointDiagnostic_v0.1.ba2.sha256.txt
            build/ba2-list.txt
            build/ba2-verify.json
          if-no-files-found: error
          retention-days: 1
