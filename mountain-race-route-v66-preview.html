<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071725">
  <title>Summit Sprint V67 Route Review</title>
  <link rel="preload" as="image" href="/assets/mountain-race/images/summit-sprint-unified-route-v67.png?v=67c">
  <link rel="stylesheet" href="/assets/mountain-race/images/summit-sprint-unified-route-v67.css?v=67c">
  <link rel="stylesheet" href="/assets/mountain-race/mountain-race-route-v66-preview.css?v=67c">
</head>
<body>
  <main class="v66-review" data-v66-review>
    <section class="v66-game" aria-label="Summit Sprint V67 isolated renderer preview">
      <header class="v66-masthead">
        <span class="v66-kicker">ALPINE EXPEDITION · ROUTE 30</span>
        <div class="v66-title-row">
          <span class="v66-mark" aria-hidden="true">▲</span>
          <h1>SUMMIT SPRINT</h1>
          <div class="v66-timer"><small>TIME</small><b data-v66-time>30</b></div>
        </div>
        <span class="v66-subtitle">NORTH FACE · 30 HOLDS · LIVE ASCENT</span>
      </header>

      <div class="v66-player-strip">
        <div class="v66-player v66-player-you">
          <span class="v66-badge">YOU</span>
          <span class="v66-player-copy"><b>CowBoyCookie</b><small>0 MISTAKES</small></span>
          <strong data-v66-score="0">0 / 30</strong>
        </div>
        <div class="v66-player v66-player-opponent">
          <span class="v66-badge">CPU</span>
          <span class="v66-player-copy"><b>Remote Bot (Normal)</b><small>1 MISTAKE</small></span>
          <strong data-v66-score="1">0 / 30</strong>
        </div>
      </div>

      <div class="v66-race-window" data-v66-window>
        <div class="v66-lane" data-v66-lane="0" aria-label="Your independently tracked route">
          <div class="v66-clouds v66-clouds-near" aria-hidden="true"></div>
          <img class="v66-route" src="/assets/mountain-race/images/summit-sprint-unified-route-v67.png?v=67c" alt="One continuous angular rocky route with connected ground, thirty ledges, and summit">
          <div class="v66-route-overlays" aria-hidden="true"></div>
          <div class="v66-climber v66-climber-you" aria-label="CowBoyCookie climber"><i></i></div>
          <div class="v66-confetti" aria-hidden="true"></div>
        </div>
        <div class="v66-lane" data-v66-lane="1" aria-label="Opponent independently tracked route">
          <div class="v66-clouds v66-clouds-far" aria-hidden="true"></div>
          <img class="v66-route" src="/assets/mountain-race/images/summit-sprint-unified-route-v67.png?v=67c" alt="Opponent copy of the same continuous angular rocky route">
          <div class="v66-route-overlays" aria-hidden="true"></div>
          <div class="v66-climber v66-climber-opponent" aria-label="Remote Bot climber"><i></i></div>
          <div class="v66-confetti" aria-hidden="true"></div>
        </div>
        <div class="v66-rope" aria-hidden="true"><i></i></div>

        <section class="v66-controls" aria-label="Live directional controls">
          <div class="v66-next">
            <span>YOUR NEXT MOVES</span>
            <div class="v66-sequence">
              <button class="active"><b>↑</b><small>NOW</small></button>
              <button><b>←</b><small>+1</small></button>
              <button><b>↓</b><small>+2</small></button>
              <button><b>→</b><small>+3</small></button>
            </div>
            <p>Every symbol uses the exact contact point baked into the route.</p>
          </div>
          <div class="v66-pad" aria-hidden="true">
            <button class="up"><b>↑</b><small>UP</small></button>
            <button class="left"><b>←</b><small>LEFT</small></button>
            <button class="down"><b>↓</b><small>DOWN</small></button>
            <button class="right"><b>→</b><small>RIGHT</small></button>
          </div>
        </section>

        <div class="v66-state-label" data-v66-state-label>START · ARMS DOWN</div>
      </div>
    </section>
  </main>
  <script src="/assets/mountain-race/mountain-race-route-v66-preview.js?v=67c" defer></script>
</body>
</html>
